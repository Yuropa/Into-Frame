  <text x="40" y="960" font-size="11" fill="#64748b">Near field: metric terrain grid (200 m). Far field: everything past the depth models' saturation, stood up as a backdrop shell. Objects are detected on the photograph and labelled by one grounding model.</text>
  <text x="40" y="978" font-size="11" fill="#64748b">Every stage runs in its own conda environment over a Unix socket; outputs are cached per stage and replayable with scripts/replay-stage.py.</text>
