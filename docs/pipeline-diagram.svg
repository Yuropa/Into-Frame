<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1600" height="900" viewBox="0 0 1600 900"
     font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif">

  <defs>
    <!-- Small arrowhead: within-column arrows -->
    <marker id="arr-sm" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <!-- Large arrowhead: between-column arrows -->
    <marker id="arr-lg" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- ── Background ───────────────────────────────────────────── -->
  <rect width="1600" height="900" fill="#f1f5f9"/>

  <!-- ── Title ─────────────────────────────────────────────────── -->
  <text x="800" y="36"
        font-size="24" font-weight="700" fill="#0f172a"
        text-anchor="middle" letter-spacing="-0.5">Into Frame — Pipeline Overview</text>
  <text x="800" y="58"
        font-size="12" fill="#64748b" text-anchor="middle">
    Photo → Panorama generation → Terrain mesh + Object placement → 3D Scene
  </text>

  <!-- ── Input pill ─────────────────────────────────────────────── -->
  <rect x="50" y="72" width="200" height="40" rx="20" fill="#0f172a"/>
  <text x="150" y="97" font-size="13" font-weight="600" fill="white" text-anchor="middle">Photo Input</text>
  <!-- Arrow: input → Phase 0 header -->
  <line x1="150" y1="112" x2="150" y2="128" stroke="#475569" stroke-width="2" marker-end="url(#arr-lg)"/>

  <!-- ══════════════════════════════════════════════════════════════
       PHASE 0 — Scene Understanding
       col x=40  cx=150  n=2  bg-h=190  bottom=320
       ══════════════════════════════════════════════════════════════ -->
  <rect x="40"  y="130" width="220" height="190" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <rect x="40"  y="130" width="220" height="52"  rx="8" fill="#4f46e5"/>
  <rect x="40"  y="174" width="220" height="8"        fill="#4f46e5"/>
  <text x="150" y="156" font-size="11" font-weight="700" fill="white"
        text-anchor="middle" letter-spacing="0.8" dominant-baseline="central">SCENE UNDERSTANDING</text>

  <!-- Captioning  y=192 -->
  <rect x="50"  y="192" width="200" height="50" rx="6" fill="white" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="150" y="212" font-size="13" fill="#312e81" text-anchor="middle" font-weight="500">Captioning</text>
  <text x="150" y="230" font-size="10" fill="#6366f1" text-anchor="middle">BLIP Large</text>
  <line x1="150" y1="242" x2="150" y2="254" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-sm)"/>

  <!-- Depth Generation  y=254 -->
  <rect x="50"  y="254" width="200" height="50" rx="6" fill="white" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="150" y="274" font-size="13" fill="#312e81" text-anchor="middle" font-weight="500">Depth Generation</text>
  <text x="150" y="292" font-size="10" fill="#6366f1" text-anchor="middle">Depth Anything 3</text>

  <!-- → Phase 1 -->
  <line x1="260" y1="156" x2="300" y2="156" stroke="#475569" stroke-width="2" marker-end="url(#arr-lg)"/>

  <!-- ══════════════════════════════════════════════════════════════
       PHASE 1 — Panorama Generation
       col x=300  cx=410  n=3  bg-h=252  bottom=382
       ══════════════════════════════════════════════════════════════ -->
  <rect x="300" y="130" width="220" height="252" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
  <rect x="300" y="130" width="220" height="52"  rx="8" fill="#0284c7"/>
  <rect x="300" y="174" width="220" height="8"        fill="#0284c7"/>
  <text x="410" y="156" font-size="11" font-weight="700" fill="white"
        text-anchor="middle" letter-spacing="0.8" dominant-baseline="central">PANORAMA GENERATION</text>

  <!-- Panorama  y=192 -->
  <rect x="310" y="192" width="200" height="50" rx="6" fill="white" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="410" y="212" font-size="13" fill="#075985" text-anchor="middle" font-weight="500">Panorama</text>
  <text x="410" y="230" font-size="10" fill="#0284c7" text-anchor="middle">WorldGen / FLUX</text>
  <line x1="410" y1="242" x2="410" y2="254" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-sm)"/>

  <!-- Supersampling  y=254 -->
  <rect x="310" y="254" width="200" height="50" rx="6" fill="white" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="410" y="274" font-size="13" fill="#075985" text-anchor="middle" font-weight="500">Supersampling</text>
  <text x="410" y="292" font-size="10" fill="#0284c7" text-anchor="middle">Swin2SR 2×</text>
  <line x1="410" y1="304" x2="410" y2="316" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-sm)"/>

  <!-- Panorama Inpainting  y=316 -->
  <rect x="310" y="316" width="200" height="50" rx="6" fill="white" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="410" y="336" font-size="13" fill="#075985" text-anchor="middle" font-weight="500">Panorama Inpainting</text>
  <text x="410" y="354" font-size="10" fill="#0284c7" text-anchor="middle">LaMa / FLUX</text>

  <!-- → Phase 2 -->
  <line x1="520" y1="156" x2="560" y2="156" stroke="#475569" stroke-width="2" marker-end="url(#arr-lg)"/>

  <!-- ══════════════════════════════════════════════════════════════
       PHASE 2 — Panorama Analysis
       col x=560  cx=670  n=3  bg-h=252  bottom=382
       ══════════════════════════════════════════════════════════════ -->
  <rect x="560" y="130" width="220" height="252" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
  <rect x="560" y="130" width="220" height="52"  rx="8" fill="#0d9488"/>
  <rect x="560" y="174" width="220" height="8"        fill="#0d9488"/>
  <text x="670" y="156" font-size="11" font-weight="700" fill="white"
        text-anchor="middle" letter-spacing="0.8" dominant-baseline="central">PANORAMA ANALYSIS</text>

  <!-- Panorama Regions  y=192 -->
  <rect x="570" y="192" width="200" height="50" rx="6" fill="white" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="670" y="212" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="500">Panorama Regions</text>
  <text x="670" y="230" font-size="10" fill="#0d9488" text-anchor="middle">SAM2.1</text>
  <line x1="670" y1="242" x2="670" y2="254" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-sm)"/>

  <!-- Skybox Inpainting  y=254 -->
  <rect x="570" y="254" width="200" height="50" rx="6" fill="white" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="670" y="274" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="500">Skybox Inpainting</text>
  <text x="670" y="292" font-size="10" fill="#0d9488" text-anchor="middle">LaMa / SD3</text>
  <line x1="670" y1="304" x2="670" y2="316" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-sm)"/>

  <!-- Panorama Lighting  y=316 -->
  <rect x="570" y="316" width="200" height="50" rx="6" fill="white" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="670" y="336" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="500">Panorama Lighting</text>
  <text x="670" y="354" font-size="10" fill="#0d9488" text-anchor="middle">Lux DiT</text>

  <!-- → Phase 3 -->
  <line x1="780" y1="156" x2="820" y2="156" stroke="#475569" stroke-width="2" marker-end="url(#arr-lg)"/>

  <!-- ══════════════════════════════════════════════════════════════
       PHASE 3 — Terrain
       col x=820  cx=930  n=6  bg-h=438  bottom=568
       ══════════════════════════════════════════════════════════════ -->
  <rect x="820" y="130" width="220" height="438" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <rect x="820" y="130" width="220" height="52"  rx="8" fill="#15803d"/>
  <rect x="820" y="174" width="220" height="8"        fill="#15803d"/>
  <text x="930" y="156" font-size="11" font-weight="700" fill="white"
        text-anchor="middle" letter-spacing="0.8" dominant-baseline="central">TERRAIN</text>

  <!-- Panorama Depth  y=192 -->
  <rect x="830" y="192" width="200" height="50" rx="6" fill="white" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="930" y="212" font-size="13" fill="#14532d" text-anchor="middle" font-weight="500">Panorama Depth</text>
  <text x="930" y="230" font-size="10" fill="#15803d" text-anchor="middle">DAP</text>
  <line x1="930" y1="242" x2="930" y2="254" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-sm)"/>

  <!-- Height Map  y=254 -->
  <rect x="830" y="254" width="200" height="50" rx="6" fill="white" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="930" y="274" font-size="13" fill="#14532d" text-anchor="middle" font-weight="500">Height Map</text>
  <text x="930" y="292" font-size="10" fill="#15803d" text-anchor="middle">equirectangular projection</text>
  <line x1="930" y1="304" x2="930" y2="316" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-sm)"/>

  <!-- Region Map  y=316 -->
  <rect x="830" y="316" width="200" height="50" rx="6" fill="white" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="930" y="336" font-size="13" fill="#14532d" text-anchor="middle" font-weight="500">Region Map</text>
  <text x="930" y="354" font-size="10" fill="#15803d" text-anchor="middle">semantic labels</text>
  <line x1="930" y1="366" x2="930" y2="378" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-sm)"/>

  <!-- Terrain Reconstruction  y=378 -->
  <rect x="830" y="378" width="200" height="50" rx="6" fill="white" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="930" y="398" font-size="13" fill="#14532d" text-anchor="middle" font-weight="500">Terrain Reconstruction</text>
  <text x="930" y="416" font-size="10" fill="#15803d" text-anchor="middle">LSQR solver</text>
  <line x1="930" y1="428" x2="930" y2="440" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-sm)"/>

  <!-- Noise Refinement  y=440 -->
  <rect x="830" y="440" width="200" height="50" rx="6" fill="white" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="930" y="460" font-size="13" fill="#14532d" text-anchor="middle" font-weight="500">Noise Refinement</text>
  <text x="930" y="478" font-size="10" fill="#15803d" text-anchor="middle">Perlin + thermal erosion</text>
  <line x1="930" y1="490" x2="930" y2="502" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-sm)"/>

  <!-- Terrain Mesh  y=502 -->
  <rect x="830" y="502" width="200" height="50" rx="6" fill="white" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="930" y="522" font-size="13" fill="#14532d" text-anchor="middle" font-weight="500">Terrain Mesh</text>
  <text x="930" y="540" font-size="10" fill="#15803d" text-anchor="middle">Delaunay triangulation</text>

  <!-- → Phase 4 -->
  <line x1="1040" y1="156" x2="1080" y2="156" stroke="#475569" stroke-width="2" marker-end="url(#arr-lg)"/>

  <!-- ══════════════════════════════════════════════════════════════
       PHASE 4 — Object Pipeline
       col x=1080  cx=1190  n=7  bg-h=500  bottom=630
       ══════════════════════════════════════════════════════════════ -->
  <rect x="1080" y="130" width="220" height="500" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <rect x="1080" y="130" width="220" height="52"  rx="8" fill="#c2410c"/>
  <rect x="1080" y="174" width="220" height="8"        fill="#c2410c"/>
  <text x="1190" y="156" font-size="11" font-weight="700" fill="white"
        text-anchor="middle" letter-spacing="0.8" dominant-baseline="central">OBJECT PIPELINE</text>

  <!-- Segmentation  y=192 -->
  <rect x="1090" y="192" width="200" height="50" rx="6" fill="white" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="1190" y="212" font-size="13" fill="#7c2d12" text-anchor="middle" font-weight="500">Segmentation</text>
  <text x="1190" y="230" font-size="10" fill="#c2410c" text-anchor="middle">SAM2.1</text>
  <line x1="1190" y1="242" x2="1190" y2="254" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-sm)"/>

  <!-- Classification  y=254 -->
  <rect x="1090" y="254" width="200" height="50" rx="6" fill="white" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="1190" y="274" font-size="13" fill="#7c2d12" text-anchor="middle" font-weight="500">Classification</text>
  <text x="1190" y="292" font-size="10" fill="#c2410c" text-anchor="middle">CLIP</text>
  <line x1="1190" y1="304" x2="1190" y2="316" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-sm)"/>

  <!-- Object Typing  y=316 -->
  <rect x="1090" y="316" width="200" height="50" rx="6" fill="white" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="1190" y="336" font-size="13" fill="#7c2d12" text-anchor="middle" font-weight="500">Object Typing</text>
  <text x="1190" y="354" font-size="10" fill="#c2410c" text-anchor="middle">CLIP</text>
  <line x1="1190" y1="366" x2="1190" y2="378" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-sm)"/>

  <!-- Recognition  y=378 -->
  <rect x="1090" y="378" width="200" height="50" rx="6" fill="white" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="1190" y="398" font-size="13" fill="#7c2d12" text-anchor="middle" font-weight="500">Recognition</text>
  <text x="1190" y="416" font-size="10" fill="#c2410c" text-anchor="middle">RAM+</text>
  <line x1="1190" y1="428" x2="1190" y2="440" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-sm)"/>

  <!-- Detection  y=440 -->
  <rect x="1090" y="440" width="200" height="50" rx="6" fill="white" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="1190" y="460" font-size="13" fill="#7c2d12" text-anchor="middle" font-weight="500">Detection</text>
  <text x="1190" y="478" font-size="10" fill="#c2410c" text-anchor="middle">Grounding DINO</text>
  <line x1="1190" y1="490" x2="1190" y2="502" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-sm)"/>

  <!-- Correlation  y=502 -->
  <rect x="1090" y="502" width="200" height="50" rx="6" fill="white" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="1190" y="522" font-size="13" fill="#7c2d12" text-anchor="middle" font-weight="500">Correlation</text>
  <text x="1190" y="540" font-size="10" fill="#c2410c" text-anchor="middle">IoU matching</text>
  <line x1="1190" y1="552" x2="1190" y2="564" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-sm)"/>

  <!-- Distribution  y=564 -->
  <rect x="1090" y="564" width="200" height="50" rx="6" fill="white" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="1190" y="584" font-size="13" fill="#7c2d12" text-anchor="middle" font-weight="500">Distribution</text>
  <text x="1190" y="602" font-size="10" fill="#c2410c" text-anchor="middle">Poisson PCF</text>

  <!-- → Phase 5 -->
  <line x1="1300" y1="156" x2="1340" y2="156" stroke="#475569" stroke-width="2" marker-end="url(#arr-lg)"/>

  <!-- ══════════════════════════════════════════════════════════════
       PHASE 5 — Scene &amp; Output
       col x=1340  cx=1450  n=2  bg-h=190  bottom=320
       ══════════════════════════════════════════════════════════════ -->
  <rect x="1340" y="130" width="220" height="190" rx="8" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1"/>
  <rect x="1340" y="130" width="220" height="52"  rx="8" fill="#7c3aed"/>
  <rect x="1340" y="174" width="220" height="8"        fill="#7c3aed"/>
  <text x="1450" y="156" font-size="11" font-weight="700" fill="white"
        text-anchor="middle" letter-spacing="0.8" dominant-baseline="central">SCENE &amp; OUTPUT</text>

  <!-- Scene Generation  y=192 -->
  <rect x="1350" y="192" width="200" height="50" rx="6" fill="white" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="1450" y="212" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="500">Scene Generation</text>
  <text x="1450" y="230" font-size="10" fill="#7c3aed" text-anchor="middle">Unity scene assembly</text>
  <line x1="1450" y1="242" x2="1450" y2="254" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-sm)"/>

  <!-- Report  y=254 -->
  <rect x="1350" y="254" width="200" height="50" rx="6" fill="white" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="1450" y="274" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="500">Report</text>
  <text x="1450" y="292" font-size="10" fill="#7c3aed" text-anchor="middle">PDF generation</text>

  <!-- ── Footer ─────────────────────────────────────────────────── -->
  <line x1="40" y1="652" x2="1560" y2="652" stroke="#e2e8f0" stroke-width="1"/>
  <text x="800" y="671" font-size="11" fill="#94a3b8" text-anchor="middle">
    Disabled (designed, not active): Linear Structures · Panorama Asset Generation · Tree Mesh · Foreground Inpainting · Mesh Generation · Panorama Cubemap
  </text>
  <text x="800" y="691" font-size="11" fill="#94a3b8" text-anchor="middle">
    Stages run sequentially left-to-right within each phase. Each phase consumes context written by the previous.
  </text>

</svg>
