<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* layout: one screen, three panes side by side: index | view (graph, map, photograph, tables, data) | detail.
   Each pane scrolls inside itself; under 900px one pane shows at a time. */
:root{
  --bg:#e9eeeb; --panel:#f4f7f5; --raise:#ffffff; --ink:#14201b; --ink2:#46564f; --ink3:#74837c;
  --line:#ccd6d0; --line2:#dfe6e2; --accent:#0b6b7a; --on-accent:#ffffff; --sel:#e8a800; --sel-soft:#fdf0c4;
  --ev-measured:#1c7c54; --ev-plan-visible:#2563a8; --ev-fitted:#7a4bb5; --ev-plan-inferred:#a86f0c; --ev-generated:#c0457a; --ev-default:#74837c;
  --f-env:#56698c; --f-ground:#8a6a45; --f-living:#3f8a4f; --f-asset:#0b6b7a; --f-backdrop:#7d8791; --f-det:#9aa7a0;
  --warn:#b3261e; --shade:rgba(20,32,27,.06);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1412; --panel:#141b18; --raise:#1a2320; --ink:#e2eae5; --ink2:#a8b7af; --ink3:#7d8c85;
  --line:#2b3732; --line2:#202a26; --accent:#56c4d2; --on-accent:#06262b; --sel:#ffcc33; --sel-soft:#3d3210;
  --ev-measured:#4fc28f; --ev-plan-visible:#6ea8ea; --ev-fitted:#b592ea; --ev-plan-inferred:#e0aa3e; --ev-generated:#ee7fae; --ev-default:#8a9992;
  --f-env:#8fa3c8; --f-ground:#c69d70; --f-living:#6fc07f; --f-asset:#56c4d2; --f-backdrop:#a3adb7; --f-det:#6f7d76;
  --warn:#ff8a80; --shade:rgba(255,255,255,.05); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1412; --panel:#141b18; --raise:#1a2320; --ink:#e2eae5; --ink2:#a8b7af; --ink3:#7d8c85;
  --line:#2b3732; --line2:#202a26; --accent:#56c4d2; --on-accent:#06262b; --sel:#ffcc33; --sel-soft:#3d3210;
  --ev-measured:#4fc28f; --ev-plan-visible:#6ea8ea; --ev-fitted:#b592ea; --ev-plan-inferred:#e0aa3e; --ev-generated:#ee7fae; --ev-default:#8a9992;
  --f-env:#8fa3c8; --f-ground:#c69d70; --f-living:#6fc07f; --f-asset:#56c4d2; --f-backdrop:#a3adb7; --f-det:#6f7d76;
  --warn:#ff8a80; --shade:rgba(255,255,255,.05); color-scheme:dark }

html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.mono{font-family:var(--mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink3)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.bar h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.bar .run{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.bar .id{display:flex;flex-direction:column;min-width:0}
.counts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2);flex:1 1 320px;min-width:0}
.counts b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
#q{flex:0 1 280px;min-width:160px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--raise)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:6px 12px;border-bottom:2px solid transparent;color:var(--ink2);white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .phone{display:none}

.panes{flex:1;min-height:0;display:grid;grid-template-columns:240px minmax(0,1fr) 350px;gap:10px}
.pane{min-height:0;min-width:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.pane,.table-wrap,.photo-scroll,.data-wrap{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.table-wrap,.photo-scroll,.data-wrap{background:var(--panel)}
.stage{position:relative;overflow:hidden;display:flex;flex-direction:column}
.stage > section{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
@media (max-width: 900px){
  .tabs .phone{display:block}
  .panes{grid-template-columns:minmax(0,1fr)}
  #app[data-pane="index"] .stage, #app[data-pane="index"] .detail,
  #app[data-pane="stage"] .index, #app[data-pane="stage"] .detail,
  #app[data-pane="detail"] .index, #app[data-pane="detail"] .stage{display:none}
}

/* index */
.index details{border-bottom:1px solid var(--line2)}
.index summary{padding:6px 10px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);cursor:pointer;display:flex;gap:6px;align-items:center}
.index summary .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink3);letter-spacing:0}
.index h2{margin:0;padding:10px 10px 4px;font-size:12px;font-weight:600;color:var(--ink)}
.row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:4px 10px 4px 14px;min-width:0}
.row:hover{background:var(--shade)}
.row[aria-current="true"]{background:var(--sel-soft);box-shadow:inset 3px 0 0 var(--sel)}
.row .t{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--ink3);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.row img,.row canvas{width:26px;height:26px;object-fit:contain;flex:none;border-radius:3px;background:var(--shade)}
.glyph{flex:none;width:12px;height:12px}
.struck .t{text-decoration:line-through;color:var(--ink3)}

/* view toolbars */
.tools{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line2);font-size:12.5px;color:var(--ink2)}
.tools label{display:inline-flex;gap:5px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--raise);padding:3px 10px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:6px;padding:3px 9px}
.fill{flex:1;min-height:0;position:relative}
.fill > svg,.fill > canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.status{padding:4px 10px;border-top:1px solid var(--line2);font-size:12px;color:var(--ink2);min-height:26px;font-family:var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px 1px 6px;background:var(--raise);font-size:12px}
.chip[aria-pressed="false"]{opacity:.45}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:currentColor}

/* graph */
#g-svg text{font-family:var(--sans);fill:var(--ink)}
#g-svg .sub{fill:var(--ink3);font-size:10.5px}
#g-svg .colhead{fill:var(--ink3);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
#g-svg .edge{fill:none;stroke:var(--ink3);stroke-width:1.1;opacity:.55}
#g-svg .edge.hot{stroke:var(--accent);opacity:1;stroke-width:1.8}
#g-svg .edge.belongs{stroke-dasharray:2 4;opacity:.35}
#g-svg .elabel{font-size:10px;fill:var(--ink2);paint-order:stroke;stroke:var(--panel);stroke-width:3px}
#g-svg .elabel.hot{fill:var(--accent);font-weight:600}
#g-svg .node{cursor:pointer}
#g-svg .node .shape{stroke:var(--panel);stroke-width:1.5}
#g-svg .node.sel .shape{stroke:var(--sel);stroke-width:3.5}
#g-svg.has-sel .node:not(.near){opacity:.5}
#g-svg.has-sel .edge:not(.hot){opacity:.15}
#g-svg .arrow{fill:var(--ink3)}

/* photograph */
.photo-scroll{flex:1;min-height:0;overflow:auto;padding:10px}
.photo-box{position:relative;display:block;margin:0 auto;max-width:none}
.photo-box img{display:block;width:100%;height:auto;max-width:none;border-radius:4px}
.photo-box svg{position:absolute;inset:0;width:100%;height:100%}
.photo-box rect{fill:transparent;stroke-width:1.6;vector-effect:non-scaling-stroke;cursor:pointer}
.photo-box rect:hover{fill:rgba(255,255,255,.14)}
.photo-box rect.off{stroke-dasharray:3 3;opacity:.75}
.photo-box rect.sel{stroke:var(--sel)!important;stroke-width:3.5;stroke-dasharray:none;opacity:1}

/* tables */
.table-wrap{flex:1;min-height:0;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:4px 8px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:top;white-space:nowrap}
td.wrap{white-space:normal;min-width:220px;max-width:420px}
th{position:sticky;top:0;background:var(--panel);font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;z-index:1;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--shade)}
tbody tr.sel{background:var(--sel-soft)}
td img{width:28px;height:28px;object-fit:contain;display:block}

/* detail */
.detail{padding:0}
.d-head{padding:12px 14px 10px;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:4px}
.d-head h2{margin:0;font-size:17px;font-weight:600;overflow-wrap:anywhere;text-wrap:balance}
.d-kind{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);display:flex;gap:6px;align-items:center}
.d-sec{padding:10px 14px;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:6px}
.d-sec h3{margin:0;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.kv{display:grid;grid-template-columns:minmax(90px,42%) minmax(0,1fr);gap:3px 10px;font-size:12.5px}
.kv dt{color:var(--ink2);overflow-wrap:anywhere}
.kv dd{margin:0;overflow-wrap:anywhere}
.attr{display:grid;grid-template-columns:minmax(0,1fr);gap:1px;padding:5px 0;border-bottom:1px dashed var(--line2)}
.attr:last-child{border-bottom:0}
.attr .a-top{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.attr .a-name{font-family:var(--mono);font-size:12px;color:var(--ink2);overflow-wrap:anywhere}
.attr .a-val{overflow-wrap:anywhere}
.attr .a-src{font-size:11.5px;color:var(--ink3)}
.ev{display:inline-flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap;border-radius:999px;padding:0 7px 0 5px;border:1px solid currentColor}
.ev::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ev.measured{color:var(--ev-measured)} .ev.plan-visible{color:var(--ev-plan-visible)} .ev.fitted{color:var(--ev-fitted)}
.ev.plan-inferred{color:var(--ev-plan-inferred)} .ev.generated{color:var(--ev-generated)} .ev.default{color:var(--ev-default)}
button.ev{background:var(--raise)} button.ev[aria-pressed="false"]{opacity:.4}
.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;text-align:left;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:0 6px;background:var(--raise);color:var(--ink2)}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumbs button{border:1px solid var(--line);background:var(--raise);border-radius:5px;padding:2px;width:52px;height:52px}
.thumbs img{width:100%;height:100%;object-fit:contain}
.figs{display:flex;flex-wrap:wrap;gap:8px}
.figs figure{margin:0;display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--ink3)}
.figs img{max-width:150px;max-height:150px;border:1px solid var(--line);border-radius:5px;background:var(--raise)}
.spin{width:100%;max-width:300px;aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:var(--raise);touch-action:none;cursor:grab;align-self:center}
.note{font-size:12px;color:var(--ink2)}
.warnline{color:var(--warn);font-size:12.5px}
.rel{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:12.5px}
.rel .p{font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
.empty{padding:24px 16px;color:var(--ink2)}
.logrow{font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line2)}
.logrow:last-child{border-bottom:0}

/* data trees */
.data-wrap{flex:1;min-height:0;overflow:auto;padding:8px 12px;display:flex;flex-direction:column;gap:10px}
.data-wrap h3{margin:6px 0 2px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.jt{font-family:var(--mono);font-size:12px;line-height:1.5}
.jt details{padding-left:14px}
.jt summary{cursor:pointer;margin-left:-14px}
.jt .leaf{padding-left:14px;overflow-wrap:anywhere}
.jt .k{color:var(--ink2)} .jt .v-s{color:var(--ev-measured)} .jt .v-n{color:var(--ev-plan-visible)} .jt .v-b{color:var(--ev-fitted)} .jt .v-0{color:var(--ink3)}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important;transition:none!important} }
</style>

<div id="app" data-pane="stage">
  <header class="bar">
    <div class="id"><h1 id="t-title"></h1><span class="run" id="t-run"></span></div>
    <div class="counts" id="counts"></div>
    <input id="q" type="search" placeholder="Find a node, model, class, attribute" aria-label="Find in the scene graph">
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Views">
    <button class="phone" data-tab="index" role="tab">Index</button>
    <button data-tab="graph" role="tab">Graph</button>
    <button data-tab="map" role="tab">Map</button>
    <button data-tab="photo" role="tab">Photograph</button>
    <button data-tab="tables" role="tab">Tables</button>
    <button data-tab="data" role="tab">Data</button>
    <button class="phone" data-tab="detail" role="tab">Detail</button>
  </nav>
  <div class="panes">
    <aside class="pane index" id="index" aria-label="Index"></aside>
    <main class="pane stage" id="stage">
      <section id="v-graph">
        <div class="tools">
          <span class="legend" id="g-legend"></span>
          <label><input type="checkbox" id="g-labels"> Relation names</label>
          <label><input type="checkbox" id="g-dets"> Detections</label>
          <button class="btn" id="g-fit" type="button">Fit</button>
        </div>
        <div class="fill"><svg id="g-svg" role="img" aria-label="Scene graph: nodes and relations"></svg></div>
        <div class="status" id="g-status"></div>
      </section>
      <section id="v-map" hidden>
        <div class="tools">
          <span class="legend" id="m-legend"></span>
          <label><input type="checkbox" id="m-ground" checked> Ground map</label>
          <button class="btn" id="m-fit" type="button">Fit</button>
        </div>
        <div class="fill"><canvas id="m-canvas" aria-label="Top-down map of every placed object"></canvas></div>
        <div class="status" id="m-status"></div>
      </section>
      <section id="v-photo" hidden>
        <div class="tools">
          <span class="seg" id="p-mode"><button type="button" data-mode="photo" aria-pressed="true">Photograph</button><button type="button" data-mode="panorama" aria-pressed="false">Panorama</button></span>
          <label><input type="checkbox" id="p-regions"> Region labels (sky, sand, water)</label>
          <label>Zoom <input type="range" id="p-zoom" min="1" max="4" step="0.25" value="1"></label>
          <span id="p-count" class="muted"></span>
        </div>
        <div class="photo-scroll"><div class="photo-box" id="p-box"></div></div>
        <div class="status" id="p-status"></div>
      </section>
      <section id="v-tables" hidden>
        <div class="tools"><span class="seg" id="t-which"></span><span id="t-count" class="muted"></span></div>
        <div class="table-wrap" id="t-wrap"></div>
      </section>
      <section id="v-data" hidden><div class="data-wrap" id="data-wrap"></div></section>
    </main>
    <aside class="pane detail" id="detail" aria-label="Detail"></aside>
  </div>
</div>
<script id="view-data" type="application/json">__DATA__</script>
<script>
'use strict';
(() => {
const V = JSON.parse(document.getElementById('view-data').textContent);
const G = V.graph, NODES = G.nodes, RELS = G.relations, MODELS = V.models, DETS = V.detections, ROWS = V.placements.rows;
const $ = (id) => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
const EVIDENCE = ['measured', 'plan-visible', 'fitted', 'plan-inferred', 'generated', 'default'];
const EV_NOTE = {measured: 'read from the photograph or the built scene', 'plan-visible': 'the Scene Plan saw it in the photograph',
  fitted: 'fitted against the photograph', 'plan-inferred': 'the Scene Plan inferred it', generated: 'made by a generator', 'default': 'a default or a class prior'};
const TYPE_ORDER = ['World', 'Style', 'Camera', 'Light', 'Medium', 'Surface', 'Mass', 'Linear', 'Backdrop', 'Population', 'Thing', 'Asset'];
const FAMILY = {World: 'env', Style: 'env', Camera: 'env', Light: 'env', Medium: 'env', Surface: 'ground', Mass: 'ground', Linear: 'ground',
  Backdrop: 'backdrop', Thing: 'thing', Population: 'population', Asset: 'asset'};
const FAMILY_VAR = {env: '--f-env', ground: '--f-ground', backdrop: '--f-backdrop', thing: '--f-living', population: '--f-living', asset: '--f-asset', det: '--f-det'};
const FAMILY_NAME = {env: 'world, camera, light, air', ground: 'surface', backdrop: 'backdrop', thing: 'thing', population: 'population', asset: 'model'};
const SURFACE_KINDS = new Set(['terrain', 'water', 'backdrop', 'formation']);
const CLASS_COLOUR = {tree: '#2e8b57', flower: '#d6457f', rock: '#8c6d4f', bush: '#7a9a2e', shrub: '#7a9a2e', grass_tuft: '#9bbf3b', plant: '#4aa08a',
  reed: '#b59b3a', boat: '#2f6fd0', ship: '#2f6fd0', building: '#a05a4a', bridge: '#7b5ea7', tower: '#7b5ea7', person: '#e07b00', animal: '#c2501f', car: '#d03a3a'};
const SPARE = ['#0b84a5', '#f6c85f', '#6f4e7c', '#ca472f', '#ffa056', '#8dddd0', '#9dd866'];

// ── small helpers ────────────────────────────────────────────────────────────────
function put(e, attrs, kids) {
  for (const k in attrs || {}) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'text') e.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids) if (kid !== null && kid !== undefined && kid !== false) e.append(kid);
  return e;
}
const h = (tag, attrs, ...kids) => put(document.createElement(tag), attrs, kids.flat());
const s = (tag, attrs, ...kids) => put(document.createElementNS(SVGNS, tag), attrs, kids.flat());
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
function num(v, sig = 4) {
  if (typeof v !== 'number' || !isFinite(v)) return String(v);
  if (Number.isInteger(v)) return v.toLocaleString('en-US');
  if (Math.abs(v) >= 1000) return Math.round(v).toLocaleString('en-US');
  return String(parseFloat(v.toPrecision(sig)));
}
function plain(v) {   // a one-line rendering, or null when the value needs a tree
  if (v === null || v === undefined) return '—';
  if (typeof v === 'number') return num(v);
  if (typeof v === 'boolean') return v ? 'yes' : 'no';
  if (typeof v === 'string') return v;
  if (Array.isArray(v) && v.length <= 8 && v.every((x) => typeof x === 'number')) return v.map((x) => num(x)).join(', ');
  if (Array.isArray(v) && v.length <= 10 && v.every((x) => typeof x === 'string')) return v.join(', ');
  if (!Array.isArray(v) && typeof v === 'object') {
    const ks = Object.keys(v);
    if (ks.length <= 4 && ks.every((k) => v[k] === null || typeof v[k] !== 'object')) return ks.map((k) => k + ' ' + plain(v[k])).join(', ');
  }
  return null;
}
function brief(v, n = 90) { const p = plain(v); const t = p === null ? JSON.stringify(v) : p; return t.length > n ? t.slice(0, n - 1) + '…' : t; }
function mass(kg) {
  if (kg === null || kg === undefined) return '—';
  if (kg >= 1000) return num(kg / 1000, 3) + ' t';
  if (kg < 1) return num(kg * 1000, 3) + ' g';
  return num(kg, 3) + ' kg';
}
function bytes(n) { return n >= 1048576 ? num(n / 1048576, 3) + ' MB' : num(n / 1024, 3) + ' kB'; }
function metres(v) { return v === null || v === undefined ? '—' : num(v, 3) + ' m'; }

if (!['graph', 'map', 'photo', 'tables', 'data'].includes(tab)) tab = 'graph';
if (m && m[2]) state.sel = {kind: m[2], id: m[2] === 'det' || m[2] === 'place' ? Number(m[3]) : m[3]};
setTab(tab);
if (state.sel) select(state.sel);
const redraw = () => { if (state.tab === 'graph') { if (!gs.fitted) fitGraph(); else viewGraph(); } if (state.tab === 'map') { if (!ms.fitted) fitMap(); else drawMap(); } markTabs(); };
if (window.ResizeObserver) new ResizeObserver(redraw).observe($('stage')); else window.addEventListener('resize', redraw);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawMap);
new MutationObserver(drawMap).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
})();
</script>
