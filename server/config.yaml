# Pipeline stage configuration.
#
# Each entry controls one stage in the pipeline:
#
#   name     – display name used in logs and progress output
#   stage    – class name from the stage registry (see pipeline.py STAGE_REGISTRY)
#   enabled  – set to false to skip a stage without removing it (default: true)
#   keys     – optional map of semantic keys to context keys, overriding defaults
#              (key names match SemanticKey enum values: input, output, depth, etc.)
#   <rest>   – stage-specific parameters forwarded to the stage's Configuration class
#
# Stages run in the order listed here.

stages:
  - name: Captioning
    stage: CaptioningStage

  - name: Depth Generation
    stage: DepthStage

  - name: Panorama
    stage: PanoramaStage
    generator_type: WORLDGEN

  - name: Panorama Supersampling
    stage: SupersamplingStage
    keys:
      input: panorama
      output: panorama

  - name: Panorama Object Depth
    stage: PanoramaDepthStage
    keys:
      output: panorama_object_depth

  # Moved ahead of Panorama Foreground Inpainting (out of the main Object
  # processing block below) so tree/forest crops already exist by the time
  # that stage builds its removal mask — see foreground_distance_m comment
  # in Panorama Foreground Inpainting for why depth thresholding alone misses
  # mid-ground vegetation. Object Recognition/Detection/Correlation/
  # Distribution/Panorama Asset Generation still run in their original later
  # position and simply see crop_{i}/metadata_{i} as already populated.
  - name: Object Segmentation
    stage: SegmentationStage
    enabled: true
    # Detect objects across the full 360° panorama (ContextKey.PANORAMA -- the
    # original, with real objects still in it) instead of just the narrow hero
    # photo, so crop_{i}/metadata_{i} boxes are panorama-pixel-space throughout
    # the rest of the object pipeline (Correlation/Distribution/Asset Generation/
    # Scene Generation already assume this -- see Object Recognition/Detection
    # below for the same change, and image_segmentation_imp.py for the panorama
    # tiling this now needs to avoid quality loss).
    keys:
      input: panorama
    # SegmentationConfiguration.min_area_fraction's default (0.0003) was calibrated
    # against 309 raw detections from one ~1200x807 hero photo. A full panorama
    # tiled into ~20-30 1024x1024 SAM2 passes multiplies that per-tile noise
    # instead of just re-measuring it against a bigger image (img_area is already
    # capped at one tile's worth -- see segmentation.py's own comment) -- observed
    # on a real alpine-meadow capture: 898 raw crops, with the default threshold
    # sitting at approximately the 1st percentile of their own size distribution
    # (i.e. barely filtering anything). Inspection at that scale showed the crops
    # are overwhelmingly individual grass blades/flower petals, not meaningful
    # discrete objects -- and this stays true even several times past the old
    # threshold, since a small flower bud and a small rock are genuinely the same
    # size to a purely geometric filter. Downstream low_confidence + DINOv2
    # corroboration (ObjectCategoryClusteringStage) already excludes anything
    # that doesn't hold up semantically from ever getting a mesh or scene
    # placement -- this threshold isn't relied on for correctness, only to avoid
    # burning BLIP/CLIP/DINOv2 passes on obvious slivers before that. 0.0015
    # (~1570px² per tile) roughly halves the raw crop count on that capture.
    min_area_fraction: 0.0015

  - name: Object Classification
    stage: PanoramaObjectClassificationStage

  - name: Object Typing
    stage: ObjectTypingStage
    # Tune both against typing_debug.json's per-crop top_candidates/object_margin.
    # Units are ImageClipClassifier._pairwise_certainty's: a softmax probability at
    # CLIP's own temperature, rescaled so 0 = a perfect tie and 1 = one-sided. It
    # saturates fast, so useful values live near the top of the range -- 0.9 is a
    # ~0.029 raw-cosine win at ViT-B/32. Do not carry the old sub-0.1 values
    # forward; those predate the temperature and no crop could ever clear them.
    object_margin_threshold: 0.9      # required gap between the winning and runner-up
                                       # object label (large crops only) before a specific
                                       # label is trusted; below this -> indeterminate
                                       # (or the scene-prior-corroborated runner-up)
    min_confident_area_fraction: 0.01 # crop bbox area / panorama area below which the
                                       # margin gate above is skipped -- small crops just
                                       # take CLIP's best-effort guess

  - name: Panorama Inpainting
    stage: PanoramaInpaintingStage
    enabled: false
    full_panorama: true
    use_depth_filter: true
    depth_filter_distance_m: 5.0  # mask kept as foreground if median depth is closer than this (metres)
    # Redirect the "objects removed, environment kept" output away from ContextKey.PANORAMA
    # (its normal default) — Panorama Regions (the original-panorama instance) / object
    # detection / distribution later read ContextKey.PANORAMA and need the ORIGINAL
    # (with-objects) panorama, exactly like PanoramaForegroundInpaintingStage already leaves
    # it untouched today. PANORAMA_TERRAIN (what Panorama Depth, Panorama Regions (Terrain),
    # Skybox Inpainting, Height Map, Region Map, and Terrain Texture Generation all actually
    # consume) is written unconditionally either way.
    keys:
      output: panorama_foreground_removed

  - name: Panorama Foreground Inpainting
    stage: PanoramaForegroundInpaintingStage
    enabled: true
    foreground_distance_m: 5.0  # mask built directly from depth: pixel is foreground if closer than this (metres)
    min_region_area_px: 200     # drop connected components smaller than this (denoise depth-model glitches)
    closing_radius_px: 12       # morphological closing to bridge small real gaps into one solid region
    mask_dilation_px: 15
    guidance_scale: 2.5
    num_inference_steps: 30

  - name: Panorama LoRA Correction
    stage: PanoramaLoraCorrectionStage
    enabled: true
    # Panorama Foreground Inpainting's ObjectClear pass has no equirectangular
    # awareness at all (no wrap padding, no pole/nadir curvature handling), so
    # the content it fabricates inside the removal mask looks like an ordinary
    # flat photo pasted into equirect space -- and the second Panorama Depth
    # pass below (a panorama-specialized model) then runs out-of-distribution
    # exactly there, corrupting depth right where objects were removed. This
    # re-touches just that region with a partial-strength FLUX.1 +
    # panorama-LoRA img2img pass first, nudging it toward the equirect-
    # projection prior the depth model actually expects. Validated against
    # config_depth_patch_test.yaml's alternative (patch the depth map directly
    # instead) — this image-domain correction won out. No-ops if Panorama
    # Foreground Inpainting found nothing to remove.
    strength: 0.35          # img2img denoise strength -- deliberately low: most of
                             # ObjectClear's output is already a plausible photo, this
                             # should nudge it toward equirect-consistent projection,
                             # not regenerate it from scratch. Raise if the corrected
                             # region still doesn't read as equirect-consistent; lower
                             # if real detail is visibly being erased.
    lora_scale: 0.85         # matches Skybox Inpainting's own use of this LoRA
    guidance_scale: 4.0
    num_inference_steps: 30
    max_resolution: 1536
    mask_extra_dilation_px: 0

  - name: Panorama Regions
    stage: PanoramaRegionStage
    nadir_cutoff_deg: -55.0 # degrees elevation: rows at/below this (the tripod/rig, heavily
                            # warped by the equirectangular projection) are discarded from
                            # SegFormer's raw output and replaced by the reliable ring above.
    nadir_band_deg: 15.0    # degrees of ring immediately above the cutoff used for the
                            # per-column majority vote that replaces the excluded band.
    # Default keys (ContextKey.PANORAMA, ContextKey.PANORAMA_REGION_TYPE_MAP, ...)
    # -- classifies the ORIGINAL, with-objects panorama. Object detection/
    # distribution and skybox inpainting need this version: they care what was
    # actually photographed, objects included. Terrain generation does not --
    # see "Panorama Regions (Terrain)" below.

  - name: Panorama Regions (Terrain)
    stage: PanoramaRegionStage
    nadir_cutoff_deg: -55.0
    nadir_band_deg: 15.0
    # Same model, same settings, run a second time against the object-removed +
    # LoRA-corrected panorama instead of the original -- mirrors how Panorama
    # Depth below is itself a second pass over PANORAMA_OBJECT_DEPTH's own
    # earlier "Panorama Object Depth" run. RegionMapStage (ridge/water/interior-
    # peak/road/trail extraction), HeightMapStage, and TerrainTextureGeneration
    # all read the _terrain keys, so a tree or other object that Panorama
    # Foreground Inpainting removed no longer shows up as VEGETATION/BUILT and
    # can't punch a hole in the ridgeline, get anchored as a fake crest, or get
    # picked as a texture reference crop.
    water_reference_type_map: panorama_region_type_map
    # Cross-check this pass's WATER calls against the pass over the ORIGINAL photo
    # above: inpainting may reveal ground, never create water. Without it, the bare
    # gravel wash foreground inpainting leaves behind reads as "water"/"sea" to
    # SegFormer, _clean_nadir_band smears that down every affected column, and the
    # terrain mesh grows a lake surface directly under the viewer -- half a metre
    # above its own shoreline, with the near-field flowers submerged under it.
    keys:
      input: panorama_terrain
      regions: panorama_regions_terrain
      type_map: panorama_region_type_map_terrain
      type_map_raw: panorama_region_type_map_raw_terrain
      confidence_map: panorama_region_confidence_map_terrain
      runnerup_type_map: panorama_region_runnerup_type_map_terrain
      ambiguous_mask: panorama_region_ambiguous_mask_terrain

  - name: Panorama Lighting
    stage: PanoramaLightingStage

  - name: Skybox Inpainting
    stage: SkyboxInpaintingStage
    # FLUX now regenerates the entire panorama (not just the non-sky region) — see
    # the stage docstring: masking to just the non-sky area left a hard kept/generated
    # boundary shaped exactly like the buried mountain silhouette, which FLUX reliably
    # rendered back as a visible cloud-ridge line tracing the seam. Full-canvas
    # generation removes that boundary (and the artifact) entirely, so
    # shroud_radius_frac / seam_heal_width_px no longer apply and have been removed.
    guidance_scale: 5.5         # FLUX's prompt-adherence strength for the sky generation;
                                # raised from 4.0 for a stronger, more defined cloud/atmosphere
                                # result instead of hewing close to the muted procedural gradient.
    strength: 0.85              # how much of the gradient composite (incl. real photographed
                                # sky) survives Pass 2 vs. being replaced by FLUX's own
                                # generation. 1.0 = fully overwritten, ignores the input almost
                                # entirely; lower keeps more of the original sky's colour/texture.

  - name: Panorama Depth
    stage: PanoramaDepthStage
    keys:
      input: panorama_terrain

  - name: Panorama Depth Calibration
    stage: PanoramaDepthCalibrationStage
    # Fits a monotonic curve from DAP's raw 0-1 output to real metric depth using the region
    # where the original hero photo overlaps the panorama (Depth Anything 3's metric depth,
    # from the "Depth Generation" stage, is real ground truth there), then applies it to the
    # whole panorama. Replaces DAP's flat, unverified `pred * 100.0` assumption — see
    # server/pipeline/panorama_depth/pano_depth_imp.py — which otherwise makes distant terrain
    # (very common for mountain horizons) indistinguishable from its hard-clamped sky value.
    num_bins: 14
    min_samples: 300
    max_extrapolation_factor: 20.0 # caps raw-prediction values beyond the fitted (near-field-only)
                                 # range at this many times the farthest/nearest fitted median
                                 # metric depth, instead of an unbounded log-space extrapolation —
                                 # DAP's raw output saturates for both real distant terrain and
                                 # hard-clamped sky, so a slope fit from a few near-field tail bins
                                 # and exponentiated over that gap was blowing up to tens of
                                 # kilometres for ~40% of the panorama, which then got discarded as
                                 # "out of bounds" downstream instead of read as real terrain.
    max_depth_m: 100.0          # hard ceiling on the farthest calibrated depth -- must match
                                 # Height Map's grid_size_meters / 2 below, since nothing farther
                                 # can ever land inside that grid anyway. Enforced by compressing
                                 # only the FAR end of the range (see _compress_far_range): identity
                                 # below 0.6 * max_depth_m, then a bounded exponential approach to
                                 # the ceiling. A flat clamp is wrong (it collapses a 120 m ridge and
                                 # a 900 m peak onto one indistinguishable wall) but so was the
                                 # uniform rescale this replaced: its scale came from the single
                                 # farthest non-sky pixel, which for any landscape photo is
                                 # effectively unbounded, and shrinking everything to suit it broke
                                 # camera_height_meters -- the other metric anchor the whole pipeline
                                 # refers elevation to. Measured on a Mount Rainier capture: a ~7.2x
                                 # global shrink put the ground 0.9 m ABOVE eye level, buried the
                                 # camera inside its own terrain, collapsed every near-field panorama
                                 # UV into a thin band at the horizon (which is what turned the baked
                                 # ground texture into a radial pinwheel of sky and snow), and made
                                 # the Region Map stage's ground gate reject 100% of cells, so the
                                 # entire top-down region map came back as a single OTHER class.

  - name: Height Map
    stage: HeightMapStage
    # Panorama depth is equirectangular (radial distances); use spherical unprojection.
    keys:
      depth: panorama_depth
      intrinsics: intrinsics
    grid_size_meters: 200.0      # side length of the output grid in metres
    grid_resolution: 4096        # grid cells per side → ~4.9 cm/cell over 200 m
    ground_y_max: -0.5           # Y threshold (camera space): points ≤ this are ground candidates
    use_equirectangular: true    # depth is from equirectangular panorama, not pinhole
    smooth_sigma: 16.0           # distance-weighted smoothing: 0 at centre → this value (px) at corners
    camera_height_meters: 1.0   # assumed camera height above ground (metres); used to derive the Y
                                 # floor filter (ground_y_min = -(camera_height + 5.0)) that rejects
                                 # sky-pixel artefacts near the horizon, and as the flood-fill reference.
    flood_fill: true             # BFS from grid centre outward; stops at height jumps and sky gaps
    flood_fill_max_step: 1.5    # max Y change (metres) between adjacent cells in the flood-fill
    label_smooth_sigma: 1.5     # Gaussian sigma (grid cells) for a NaN-aware smoothed copy used only
                                 # to decide flood-fill connectivity, absorbing depth-model noise that
                                 # would otherwise spuriously sever a small patch into its own tiny
                                 # "formation"; doesn't alter the actual returned height values. 0 disables.
    nadir_exclusion_radius: 1.5 # metres: discard near-nadir equirectangular pixels within this
                                 # radius of the camera; their depth is unreliable and projects
                                 # directly below the user, creating a spurious bowl/valley.
                                 # Kept small — this radius (plus nadir_ramp_width below) is
                                 # entirely unconstrained in the reconstruction solve, so making
                                 # it larger than necessary directly enlarges the flat disc around
                                 # the user.
    nadir_ramp_width: 3.0       # metres over which certainty ramps from 0 (at exclusion boundary)
                                 # to full geometric certainty; prevents a hard ring artifact.
    far_exclusion_radius: 45.0  # metres: mirror image of nadir_exclusion_radius at the far end.
                                 # Beyond this radius, a cell backed only by the flat-ground
                                 # single-ray guess (no real forward-projected sample) stops
                                 # counting as observed ground truth for hard-pinning purposes —
                                 # sin(phi_grid) -> 0 out there crushes real elevation signal
                                 # toward a coincidentally flat-looking height regardless of the
                                 # real depth value, the same instability as the nadir case just
                                 # suppressing signal instead of amplifying noise. Cells with a
                                 # genuine forward-projected sample are exempt and always trusted
                                 # regardless of range. Certainty and the computed height are left
                                 # alone; only hard-pinning is affected. Chosen a bit past
                                 # certainty_falloff_meters (already ~16% trust by 45 m) — on one
                                 # test capture, single-ray cells with no real sample were wrong
                                 # more often than not (ratio of implied-to-expected-flat depth <
                                 # 0.5) starting around 30-50 m and worsening steadily beyond that.
                                 # None disables. See HeightMapGenerator.generate's docstring.
    certainty_falloff_meters: 20.0 # distance at which observed-ground certainty decays to 0.5.
                                 # A depth-model-trust radius, NOT camera_height_meters — using
                                 # camera height (~1 m) here made certainty collapse to a few
                                 # percent within 2-3 m, below any usable confidence_threshold in
                                 # Terrain Reconstruction, so nothing beyond the nadir disc was ever
                                 # trusted and mid-range terrain was entirely reinvented by the
                                 # solver/noise. At 20 m, real ground crosses confidence_threshold
                                 # (0.18) out to ~43 m, matching the ~20 m ridge_min_anchor_distance
                                 # cutoff's assumption that near terrain is already observed.
    elevation_distortion_power: 1.0 # exponent on cos(phi), phi = true camera-relative elevation
                                 # angle to each observed cell -- the standard equirectangular
                                 # areal-distortion factor: 1 straight ahead at the horizon
                                 # (least warped), falling to 0 at the top/bottom of the source
                                 # panorama (zenith/nadir), where equirectangular stretching makes
                                 # the raw depth estimate itself least reliable, independent of how
                                 # far away the ground point is. 0 disables.
    save_point_cloud: true      # debug artefact: dense sky-masked point cloud from the raw
                                 # panorama depth (no ground-plane Y filter, no grid binning),
                                 # written to <build>/ground_point_cloud.glb
    point_cloud_stride: 4       # take every Nth panorama pixel per axis before unprojecting
    min_forward_samples: 4      # minimum forward-projected panorama pixels landing in one grid
                                 # cell before its per-cell mean/relief/slope statistics count as
                                 # "dense" (real intra-cell averaging, incl. slope). Below this,
                                 # a cell with at least one real forward-projected sample still
                                 # unconditionally overrides the inverse-mapped guess (just without
                                 # a slope/relief measurement) — only a cell with zero real forward
                                 # samples keeps the inverse-mapped value.
    fill_boundary_falloff_cells: 6.0 # unobserved-cell fill: how many cells (at each octave's
                                 # own resolution) beyond a real observation the injected noise
                                 # needs before reaching full amplitude — fill right next to real
                                 # data (e.g. the occluded top of a cliff whose base is directly
                                 # observed) hugs that data's diffused trend instead of drifting
                                 # via unconstrained randomness
    min_component_area_fraction: 0.001 # connected ground components smaller than this fraction
                                 # of the grid are folded into the interpolated-gap fallback
                                 # instead of kept as their own component (see
                                 # HEIGHT_MAP_COMPONENT_ID / TerrainMeshStage's formation meshes)
    despike_threshold_m: 0.3    # any cell (including dense_mask/any_forward_mask, backed by
                                 # min_forward_samples' multi-sample stats — a mixed-pixel cell
                                 # straddling a real depth discontinuity can still disagree
                                 # sharply with its neighbours even after averaging) whose height
                                 # differs from its own despike_window neighbourhood median by
                                 # more than this are replaced by that median — a "flying pixel"
                                 # edge where the depth model flickers between two competing
                                 # surfaces otherwise lands as an alternating checkerboard of
                                 # spikes between adjacent cells. 0 disables.
    despike_window: 5           # odd cell-window size for the local median used above
    despike_reference_distance_m: 10.0 # depth-model noise grows with sampled range and is
                                 # further amplified for elevated/steep rays (Y = depth *
                                 # sin(phi)); the effective despike threshold shrinks below
                                 # despike_threshold_m (never above it) for cells sampled
                                 # beyond this distance, scaled by this / sampled_depth.
    despike_dense_threshold_scale: 2.5 # extra multiplier on the despike threshold for
                                 # dense_mask/any_forward_mask cells only — already averaged
                                 # over multiple forward-projected samples, so genuine sensor
                                 # noise should mostly have cancelled; a bigger deviation is
                                 # required before one is flagged than a single-ray cell needs.
    despike_dense_min_real_support: 0.6 # minimum fraction (0-1) of real (non-interpolated)
                                 # cells required in a dense_mask/any_forward_mask cell's own
                                 # despike_window before it can be flagged at all — protects a
                                 # real, sparsely-surrounded sample (e.g. an isolated distant
                                 # ridge point) from being judged against a mostly-fabricated
                                 # local median and wrongly flattened.
    region_closing_iterations: 2 # binary closing passes on the ground-valid classification
                                 # before it gates which pixels count as ground — per-pixel
                                 # semantic segmentation is noisy right at class boundaries;
                                 # closing removes single-pixel holes/islands that would
                                 # otherwise show up as salt-and-pepper speckle in both the
                                 # observed mask and the height values sampled from it.
                                 # 0 disables.
    single_sample_blur_sigma: 1.5 # Gaussian sigma (grid cells) for a partial blur applied
                                 # only to single-inverse-mapped-sample cells (no intra-cell
                                 # averaging), blended in per-cell by (1 - certainty) — dense
                                 # (multi-sample) cells are never touched. Targets per-pixel
                                 # depth-model dither that despiking's outlier test can't
                                 # catch (neighbouring single-sample cells usually carry
                                 # similar-magnitude noise, so no individual cell stands out
                                 # from a clean local median). 0 disables.

  - name: Region Map
    stage: RegionMapStage
    grid_size_meters: 200.0     # must match Height Map grid extent
    grid_resolution: 4096       # must match Height Map resolution
    ground_y_max: -0.5
    camera_height_meters: 1.0
    nadir_exclusion_radius: 3.0 # metres: exclude near-nadir cells whose segmentation is
                                 # unreliable due to equirectangular distortion at the bottom
                                 # of the panorama; filled inward by the flood fill instead.
                                 # Deliberately wider than Height Map's own nadir_exclusion_radius:
                                 # unlike there, widening this has no geometry cost (it only
                                 # decides which cells seed the type flood-fill vs. borrow their
                                 # type from the nearest reliable ring), so it can track the
                                 # segmentation model's actual distorted footprint rather than
                                 # being capped to avoid enlarging an unconstrained flat disc.
    nadir_ramp_width: 5.0       # metres over which flood-fill certainty ramps up from 0.
    certainty_falloff_meters: 20.0 # must match Height Map's value — see that stage's comment.
    ridge_prominence_min_m: 0.0  # 0 = anchor the whole photographed horizon. This used to be 20 m,
                                 # to stop a near-complete ring of Dirichlet anchors from flooding the
                                 # near field -- but that flooding came from the slope envelope's
                                 # unbounded reach and the jaggedness map's missing falloff, both now
                                 # fixed at source (see envelope_max_reach_m). Prominence is also the
                                 # wrong instrument: a photographed horizon is a smooth closed curve
                                 # and smooth curves have almost no prominence, so the filter kept
                                 # only the two locally-peaked spots. Measured on the Rainier
                                 # panorama: all 4096 columns carry a real crest at 16-54 m, yet only
                                 # 19% of azimuth survived -- a mountain in front, one behind, and
                                 # flat ground through 290 degrees. Raise it again only for a capture
                                 # with a genuinely flat horizon.
    ridge_prominence_shoulder_m: 25.0  # arc-length window kept either side of a qualifying peak;
                                 # unused while ridge_prominence_min_m is 0.
    interior_peak_max_range_factor: 2.0 # interior-peak candidates farther than
                                 # (grid_size_meters/2 * this) are dropped rather than
                                 # clamped onto the grid boundary — real distant content
                                 # (a mountain summit kilometres out) isn't representable
                                 # in this local terrain grid and would otherwise clamp to
                                 # a meaningless flattened position (see
                                 # RegionMapGenerator.extract_interior_peaks)
    interior_peak_min_depth_m: 50.0 # interior-peak candidates nearer than this are
                                 # excluded — depth_jump_rel is a relative threshold,
                                 # trivially satisfied by routine close-range ground
                                 # undulation that isn't a meaningfully elevated feature;
                                 # near_side's foreground-bias selection would otherwise
                                 # let near-camera noise dominate the output

  - name: Linear Structures
    stage: LinearStructureStage
    enabled: false
    modify_rivers: false
    modify_roads: false

  - name: Terrain Reconstruction
    stage: TerrainReconstructionStage
    solve_resolution: 512           # downsample to this for the harmonic solve, upsample after
    # Cells are held fixed at their observed elevation based on HEIGHT_MAP_OBSERVED_MASK
    # (a genuine direct point-cloud measurement), not HEIGHT_MAP_CERTAINTY -- certainty
    # decays with distance from camera and would leave most real terrain beyond ~43 m
    # (with the old 0.18 threshold and 20 m certainty_falloff_meters) unpinned, treated
    # identically to an unobserved gap. The synthetic nadir flat-ground prior is never
    # part of the observed mask, so it stays a soft, solver-overridable guess as before.
    ridge_min_anchor_distance: 0.2  # fraction of grid half-radius; chains closer than this are skipped
                                     # (assumed already captured by observed terrain — lowered from
                                     # 0.5 so nearer ridges/hills still anchor the solve instead of
                                     # being left to pure interpolation).
    ridge_max_slope_angle_deg: 38.0 # angle of repose for slope envelope below ridge crests (°);
                                    # ~35° loose talus, ~38° consolidated rock, ~45° hard bedrock.
                                    # Only applies where cliff_mask is ~0; see cliff_max_slope_angle_deg.
    ridge_override_min_distance_m: 30.0 # cells nearer than this to the camera are never overwritten
                                    # by the ridge/mountain slope envelope, no matter how much higher
                                    # it implies they should be -- keeps the override doing what it's
                                    # for (correcting weak far-range depth against distant real
                                    # ridgelines) without reaching in and replacing good near-camera
                                    # measured ground, which read as elevation spikes and crossing-seam
                                    # artifacts right around the user.
    ridge_override_feather_m: 15.0  # width (m) of the linear ramp-in beyond ridge_override_min_distance_m
                                    # before the envelope reaches full strength -- avoids a hard step
                                    # from real ground straight to the envelope's value at one exact
                                    # radius (30-45m here); full override still applies past that band.
    river_valley_depth: 0.5         # metres to lower river nodes below observed terrain
    river_drop_per_segment: 0.05    # additional metres drop per ordered river segment
    lake_y_range_threshold: 0.3     # Y-range threshold (m) to distinguish flat lakes from sloped water
    # Cliff mask: combines (a) measured slope on directly-observed terrain (gated on
    # HEIGHT_MAP_OBSERVED_MASK, not certainty) — real ground truth, strongest close to
    # the camera — with (b) distant ridge-chain silhouette jaggedness, the only
    # steepness signal available for mountains beyond depth range. Written to context
    # as CLIFF_MASK for reuse by Terrain Noise Refinement.
    cliff_slope_angle_low_deg: 50.0  # measured slope below this → not a cliff (strength 0)
    cliff_slope_angle_high_deg: 75.0 # measured slope at/above this → fully a cliff (strength 1)
    cliff_max_slope_angle_deg: 82.0  # slope envelope cap where cliff_mask > 0, vs. the talus
                                      # angle (ridge_max_slope_angle_deg) elsewhere
    # Cliff-top shelf: a directly-observed cliff face whose top edge borders occluded
    # terrain (camera saw the face, never the plateau beyond it) would otherwise be
    # left as free nodes with no local anchor, letting the harmonic solve ramp that
    # plateau down toward low ground fixed near the cliff's base. This projects a
    # shallow shelf outward from each cliff blob's crest instead.
    cliff_shelf_angle_deg: 8.0        # shallow assumed slope (°) projected outward from the
                                       # crest into occluded terrain beyond it. 0 disables.
    cliff_shelf_crest_percentile: 85.0 # within each connected measured-cliff blob, cells at/
                                        # above this elevation percentile count as the crest
    cliff_shelf_min_blob_cells: 20    # ignore measured-cliff blobs smaller than this (at solve
                                       # resolution) to avoid anchoring on stray steep-pixel noise
    envelope_smooth_m: 3.0            # blur (metres) on the combined ridge/shelf envelope before
                                       # it pins free nodes -- softens the handoff where one crest
                                       # source's nearest-neighbour region meets another's (visible
                                       # otherwise as an axis-aligned-looking seam/box in the
                                       # reconstructed heightmap). 0 disables.
    envelope_min_radius_m: 15.0       # neither envelope may pin a free node within this radius of
                                       # the camera, regardless of what its projected profile says --
                                       # a distant summit's own worst-case talus slope routinely still
                                       # has residual elevation left by the time it reaches the camera
                                       # (measured: a real, correctly-anchored 54 m summit 65 m away
                                       # left +3.4 m of "still descending" elevation at the origin,
                                       # hard-pinned into a flat plateau there). The camera's own
                                       # position already has a much better-justified flat-ground-ish
                                       # prior (the nadir disc + real sparse observed coverage) that
                                       # should always win over that assumption. 0 disables.
    envelope_max_reach_m: 25.0        # how far from its own crest either envelope may pin anything.
                                       # Both envelopes are lower BOUNDS ("terrain this close to a
                                       # crest cannot have descended below X"), tight just under the
                                       # crest and progressively meaningless further out -- pinning one
                                       # as a hard Dirichlet value asserts the terrain sits exactly on
                                       # the bound the whole way. Unbounded, a 54 m crest at 70 m still
                                       # carried 15-20 m of cone back to the camera and pinned it there,
                                       # fabricating a complete ridge encircling the viewer with the
                                       # real mountain behind it. 0 disables the limit.
    envelope_reach_feather_m: 10.0    # taper band past envelope_max_reach_m over which the envelope
                                       # fades back to the observed height, so the reach limit doesn't
                                       # simply relocate the fabricated ring to its own cutoff radius.
    despoke_angular_sigma_deg: 3.0    # remove radial "spokes" (per-panorama-column depth bias mapped
                                       # onto radial lines and pinned as Dirichlet BCs the solve can't
                                       # smooth). Subtracts only the tangential high-freq component via
                                       # a ring-free polar-difference; mountains (broad in azimuth) and
                                       # radial detail are preserved. Degrees of azimuth; 0 disables.
    despoke_min_radius_m: 4.0         # never touch the nadir singularity; ramp the correction in
    despoke_feather_m: 3.0            # over this band past despoke_min_radius_m.

  - name: Terrain Noise Refinement
    stage: TerrainNoiseRefinementStage
    road_blend_weight: 0.8        # how strongly road skeleton flattens terrain (0–1)
    road_blur_sigma: 4.0          # pixel radius for softening road mask edges
    road_terrain_smooth_sigma: 6.0 # smoothing radius for the graded road proxy
    noise_scale: 80.0             # fBm base wavelength in pixels
    noise_octaves: 4              # fractal octave count
    noise_amplitude: 0.2          # metres of peak noise displacement. Was briefly raised to 0.6 to
                                   # texture the harmonic solve's smooth fill farther from the camera,
                                   # but combined with the low certainty of the synthetic nadir prior
                                   # right at the grid center, that read as spiky noise directly under
                                   # the camera -- reverted back to the original value. Texturing the
                                   # smooth fill is instead handled by unobserved_texture_amplitude
                                   # below, which avoids that failure mode (see there).
    unobserved_texture_amplitude: 0.6 # metres of meso-scale fBm re-injected into UNOBSERVED terrain
                                   # AFTER every smoothing pass (diffusion, and hydro erosion's
                                   # downsample-to-hydro_resolution round-trip both otherwise strip the
                                   # fill's texture, leaving reconstructed slopes and the nadir a smooth
                                   # dome -- the "plateau"). Unlike the reverted noise_amplitude bump
                                   # above, this is gated by (1 - protect) so it lands ONLY on
                                   # unobserved/untrusted cells and fades to nothing into real data, and
                                   # runs post-erosion at full res so it survives. Preserves mountains
                                   # (measured: r60-80 std unchanged) and observed detail. NOTE: the
                                   # small hard nadir disc at the exact grid centre (the height-map
                                   # flat-prior crater, r < nadir_exclusion+ramp) is a separate
                                   # geometric artefact this does NOT remove -- see docs/terrain_dev.
                                   # 0 disables.
    linear_diffusivity: 1.0e-3    # Landlab K_d: hillslope diffusivity in m²/[synthetic yr]
    diffusion_dt: 2250.0          # synthetic timestep; diffusion_length ≈ sqrt(4 × K_d × dt) ≈ 3 m.
                                   # Raised from 200 (≈0.9 m) — that was only rounding multi-cell
                                   # solver artefacts, too short to smooth the kink where the ridge
                                   # slope envelope (see Terrain Reconstruction) snaps on against the
                                   # foreground. LinearDiffuser's implicit solve is unconditionally
                                   # stable, so raising dt alone (rather than K_d) is safe.
    landlab_resolution: 1024      # downsample to this resolution for Landlab, upsample after
    peak_sharpness: null          # null = auto-derive spatially from silhouette; explicit float = uniform
    peak_sharpness_min: 1.0       # auto range lower bound (flat/rolling hills)
    peak_sharpness_max: 2.5       # auto range upper bound (sharp alpine peaks)
    peak_sharpness_window_m: 20.0 # sliding window size (metres) for local jaggedness scoring
    peak_sharpness_spread_m: 15.0 # Gaussian spread radius (metres) from ridge into surrounding terrain
    hydro_enabled: true           # stream power erosion to carve valleys and channel networks
    hydro_erodibility: 1.5e-5    # K_sp: erodibility constant (m^(1-2m)/yr); increase to carve deeper
    hydro_dt: 1000.0              # timestep per erosion step (conceptual years)
    hydro_n_steps: 10             # number of erosion steps; total time = hydro_dt × hydro_n_steps
    hydro_resolution: 256         # downsample resolution for flow routing (speed vs. channel detail)
    cliff_noise_suppression: 0.85 # fraction of fBm noise amplitude suppressed on protected (cliff OR
                                   # observed-trust, see observed_trust_strength) cells; diffusion and
                                   # hydro erosion are always fully excluded there (see
                                   # TerrainReconstructionStage for how CLIFF_MASK is built)
    observed_trust_strength: 1.0  # how strongly HEIGHT_MAP_CERTAINTY (real point-cloud trust, already
                                   # decaying smoothly with distance from observed data) additionally
                                   # protects cells from noise/diffusion/erosion, on top of CLIFF_MASK.
                                   # 0 = old behaviour (only the literal true_observed boolean, restored
                                   # at the very end of this stage, is protected -- everything else gets
                                   # full-strength synthesis no matter how close it is to real data).
                                   # 1.0 = a certainty=1 cell is fully protected, same as a cliff cell.

  - name: Region Map Refinement
    stage: RegionMapRefinementStage
    certainty_threshold: 0.2        # cells below this are candidates for height-based reclassification
    water_elevation_tolerance: 0.5  # metres; cells within this band of known water surface → WATER
    water_gradient_threshold: 0.04  # m/m slope; flatter than this is eligible for WATER
    terrain_gradient_threshold: 0.15 # m/m slope; steeper than this → TERRAIN
    paint_width: 2                  # grid-cell half-width to dilate painted polylines

  - name: Terrain Mesh
    stage: TerrainMeshStage
    inner_min_dist: 0.10    # metres between samples at the origin (10 cm)
    outer_min_dist: 2.0     # metres between samples at the domain corners
    n_boundary: 64          # anchor points per edge of the domain rectangle
    z_far: null
    noise_amplitude: 0.05   # metres of peak noise displacement. Was briefly raised to 0.15 alongside
                             # Terrain Noise Refinement's own increase, but reverted for the same
                             # reason -- see that stage's noise_amplitude comment.
    noise_blend_floor: 0    # minimum noise blend fraction at the camera origin. Was briefly raised
                             # to 0.15 to avoid a perfectly noise-free spot directly under the user,
                             # but that landed as visible spikiness right at the grid center instead
                             # -- reverted to 0. Ramps up to 1.0 at the domain corner as before. Only
                             # applies where HEIGHT_MAP_OBSERVED_MASK is false — vertices sitting on
                             # real point-cloud geometry get zero added noise regardless of distance.
    water_depression_m: 0.5 # metres the lakebed is carved below the water surface (from REGION_MAP's
                             # WATER cells), so an eventually-animated water plane's wave amplitude
                             # never exposes the terrain underneath it. Also emits a separate flat
                             # water mesh (WATER_MESH) at the un-depressed water surface elevation.
    # Coarse geometry-only collision mesh (TERRAIN_PHYSICS_MESH), generated by
    # re-running the same Poisson-disc/Delaunay sampling as inner/outer_min_dist
    # above (same near-camera density bias, scales with grid size the same way)
    # at far sparser spacing, with water/formation depression carried through but
    # no texture/UV or cosmetic noise -- for Unity's MeshCollider.
    physics_inner_min_dist: 0.5   # metres between samples at the origin
    physics_outer_min_dist: 8.0   # metres between samples at the domain corners
    physics_n_boundary: 24        # anchor points per edge of the domain rectangle
    # Non-primary connected ground components (HEIGHT_MAP_COMPONENT_ID -- a separate
    # landmass, an isolated rock formation, anything real but genuinely disconnected
    # from the base terrain) each get their own separate mesh instead of being folded
    # into or discarded from the base terrain. See TERRAIN_FORMATIONS.
    formation_depression_m: 0.5  # metres the base terrain is carved below each formation's
                                 # own real height where it sits, mirroring water_depression_m
    formation_min_dist: 0.5     # metres between samples in a formation's own (uniform-density,
                                 # unlike the main terrain's near/far falloff) Poisson disc mesh
    formation_n_boundary: 8     # anchor points per edge of a formation's own bounding rectangle
    physics_formation_min_dist: 2.0  # coarser sibling of formation_min_dist, for each formation's
                                 # own physics mesh (see physics_inner/outer_min_dist above) --
                                 # without this, the base terrain's own depression under a formation
                                 # would be a hole in the collision surface with nothing to fill it.
    physics_formation_n_boundary: 8  # coarser sibling of formation_n_boundary
    formation_min_relief_m: 1.0  # a disconnected component must rise at least this far to be
                                 # promoted to its own formation mesh. Connectivity alone can't tell
                                 # a real landmass from a forward-projection wedge -- a contiguous run
                                 # of panorama columns unprojects into a thin near-flat fan radiating
                                 # from the camera, which then gets its own mesh, collision proxy,
                                 # generated texture, and a depression carved under it. Measured on
                                 # one capture: an 89 x 17 m sliver with 1.3 m of relief.
    formation_max_extent_fraction: 0.35  # reject components whose long side exceeds this fraction of
                                 # the grid -- an "isolated rock formation" spanning half the world
                                 # is neither isolated nor a rock.
    formation_max_aspect_ratio: 4.0  # reject slivers; projection wedges are long and thin, real
                                 # landmasses are compact-ish.
    debug_uv_texture: true     # true: embed a synthetic R=U/G=V gradient (with gridlines) as the
                                 # GLB preview material instead of the real panorama, sampled
                                 # through the same corrected panorama UV (TEXCOORD_1) as everything
                                 # else -- lets you read a vertex's UV straight off its colour in a
                                 # generic viewer. Only affects the embedded preview; Unity's live
                                 # render never reads it either way.

  - name: Terrain Texture Generation
    stage: TerrainTextureGenerationStage
    tile_size: 1024             # px per seamless region tile (FLUX generates at this size)
    blend_map_size: 512         # px for the blend maps
    blend_sigma: 0.05           # gaussian blend width at region boundaries (fraction of blend_map_size)
    min_region_fraction: 0.02   # regions smaller than this fraction are skipped
    inpainting_type: FLUX
    num_inference_steps: 35
    guidance_scale: 3.5
    seam_width_fraction: 0.08   # half-width of seam mask as fraction of tile_size
    seam_dilation_px: 4         # dilation applied to seam mask before inpainting
    # Seam fix crops each seam band out, downscales it, inpaints, then upscales/feathers
    # it back in -- avoids stamping a patch of crisp, full-resolution FLUX noise right on
    # the seam (same trick as the skybox panorama's own wrap-seam repair).
    seam_fix_context_px: 64     # real pixels of surrounding context kept around the band
    seam_fix_max_size: 512      # crop is downscaled to this before FLUX, then upscaled back
    seam_fix_feather_px: 24.0   # gaussian feather radius blending the fix back into the original
    # Width (fraction of tile_size) of the ring around all four tile edges that Pass 1
    # actually has to generate -- reference patches are tiled edge to edge to fill the rest
    # of the interior (_build_reference_canvas), so this is a real, bounded outpaint of a
    # thin border rather than extrapolating most of the tile from a small inset patch. 0
    # disables it (patches fill the whole tile, nothing left to outpaint).
    outpaint_border_fraction: 0.08
    # Several real reference crops (_extract_reference_patches) instead of one -- tiled
    # across the interior grid (_build_reference_canvas), gives Pass 1 more than one real
    # colour/lighting anchor since generated fill (in the outpaint ring) can drift far from
    # a single one.
    num_reference_patches: 1
    # Each extracted patch's own resolution, as a fraction of tile_size when there's only
    # one; scaled down by 1/sqrt(num_reference_patches) so total sampled area stays
    # comparable. Independent of how large it ends up on the tile canvas -- the interior
    # grid resizes each patch again to fill its own cell regardless of this size.
    reference_patch_fraction: 0.7
    # Delight each reference patch with IntrinsicDiffusion (predicted albedo) before it's
    # used as a Pass 1 guidance seed, instead of the raw photo pixels -- the raw patch's
    # baked-in sun/shadow/exposure gets stamped across the whole tile at
    # synthetic_tile_factor repeats, which doesn't tile and fights the tile's own "flat
    # overcast, no directional shadows" prompt.
    use_intrinsic_delighting: true
    intrinsic_delight_strength: 0.6 # blend toward the predicted albedo (1.0 = fully delit) --
                                 # full strength looked unnaturally flat/washed out
    intrinsic_resolution: 768   # working resolution for the delighting pass
    intrinsic_agg_num: 2        # samples averaged per delit patch (lower = faster, guidance seed only)
    # Swin2SR 2x each (optionally delit) reference patch, then LANCZOS back down to its own
    # size, before it's composited onto the Pass 1 canvas -- sharper/denoised source for
    # both the pasted patch itself and the canvas's own background fill (which stretches a
    # copy of it up to the full tile), the same "render bigger, downsample for quality"
    # trick used for Flux fills elsewhere (see supersample_inpaint).
    use_patch_supersampling: true
    # Pass 1 extends the patch to fill the whole tile as pure guidance (not hard-preserved):
    # LAMA = classical texture-completion, no prompt/LoRA/hallucination (recommended — the
    # LoRA doesn't reliably honour a "keep" mask region since it was never trained on masked
    # inputs, observed as the patch being replaced with unrelated content). FLUX = ordinary
    # img2img with this stage's own LoRA temporarily disabled instead.
    pass1_inpainting_type: LAMA
    # Temporarily off -- FLUX_SEAMLESS_TEXTURE was producing visible artifacts. Runs plain
    # FLUX.1-Fill-dev with no LoRA loaded at all until re-enabled.
    use_lora: false
    mask_feather_px: 12.0       # Pass-1 mask feather (FLUX option only; LaMa ignores it)
    reference_strength: 0.60   # img2img strength for Pass 1 (if FLUX) and Pass 2's full-tile
                               # LoRA repaint over Pass 1 — the only thing anchoring Pass 2
                               # to Pass 1's real-texture content rather than inventing anew
    # 200 m terrain / 4 m per tile = 50 repeats → ~0.4 cm/texel at 1024 px
    # Adjust proportionally for different grid_size_meters: factor = grid_size / tile_world_size
    synthetic_tile_factor: 50.0
    # Panorama layer coverage: viewing-latitude ramp (camera at world origin) that keeps
    # the real photo dominant across almost the whole terrain. Synthetic tiles only fill
    # the narrow nadir hole under the camera and a thin band right at the horizon, where
    # distant flat ground is compressed into just a few panorama pixel rows -- plus
    # (automatic, no config knob) anywhere HEIGHT_MAP_OBSERVED_MASK says the height at
    # that point was interpolated rather than measured, even if the viewing angle looks
    # safe, since the shader's panorama lookup uses that (possibly fabricated) world
    # position and would otherwise sample whatever real content happens to sit there.
    use_panorama_layer: true
    panorama_blend_power: 1.0   # exponent on the latitude ramp; higher sharpens the fades
    nadir_cutoff_deg: -85.0     # steeper than this (near-straight-down) → synthetic only
    nadir_fade_deg: 4.0         # ramp width above the nadir cutoff
    horizon_fade_deg: 1.5       # ramp width below the horizon
    panorama_layer_max_resolution: 4096 # longest-edge cap for the panorama texture layer,
                                 # decoupled from tile_size (that's a FLUX generation
                                 # constraint, not relevant to a plain resize of the real
                                 # photo). Keeps native ~2:1 aspect; only downscales past
                                 # this cap. Matches ground_point_cloud.glb's color fidelity
                                 # much more closely than the old square 1024px resize did.
    # Debug: save every intermediate image of the generation process (reference patch,
    # Pass 1 canvas/mask/result, Pass 2 raw/seam-fixed/sharpened/final) per region to
    # <temp>/texture_generation/, so each step can be inspected.
    debug_save_steps: true
    # Real-material pattern texturing (pipeline/terrain/pattern_texture.py, adapted from
    # Neyret & Cani's "Pattern-Based Texturing Revisited", SIGGRAPH '99 -- see
    # resources.bib): tried first for every region type, using the real photo instead of
    # FLUX hallucination wherever the panorama layer above doesn't already cover it
    # directly. FLUX generation above is the explicit last-resort fallback when this
    # returns nothing (no usable real reference for that region type, or the terrain
    # mesh isn't available yet).
    use_pattern_texture: true
    pattern_certainty_threshold: 0.5  # panorama-layer weight below this -> needs synthesis
    pattern_reference_patch_size: 512 # library samples are small triangular crops, not a
                                       # whole tile's guidance seed -- smaller than tile_size
    pattern_num_reference_patches: 4  # library variants per region type
    pattern_sample_res: 128           # working resolution of one triangular library sample
    pattern_border_width_frac: 0.45   # fraction of a sample's inradius blended toward the
                                       # shared border colour -- wide and low-contrast (not a
                                       # thin flat ring) reads as one continuous material
                                       # rather than a visibly "faceted" tiling
    pattern_feather_band_px: 48.0     # image-space feather (px, at pattern_canvas_size)
                                       # blending the synthesized region back toward real
                                       # photo content at its boundary with the panorama layer
    pattern_feather_sigma_px: 8.0
    pattern_min_coverage_fraction: 0.002 # skip (fall back to FLUX) if a region type's
                                       # needs-synthesis footprint is smaller than this
    pattern_canvas_size: 2048         # resolution of the baked layer (tile_factor=1.0, a
                                       # one-shot world-space bake, not tiled like FLUX layers)

  # Object processing: segmentation → classification → typing → recognition → detection →
  # instance refinement → correlation
  # All stages must be enabled together; PanoramaAssetGeneration consumes their output.
  # Segmentation/Classification/Typing now run earlier (see Panorama Foreground Inpainting
  # section above) — Recognition/Detection/Instance Refinement/Correlation pick up their
  # crop_{i}/metadata_{i} output from there, unchanged.

  - name: Object Recognition
    stage: RecognizeAnythingStage
    keys:
      input: panorama

  - name: Object Detection
    stage: ObjectDetectionStage
    keys:
      input: panorama

  - name: Object Instance Refinement
    stage: ObjectInstanceRefinementStage
    keys:
      input: panorama
    coalesce_touch_dilation_px: 15
    split_outlier_area_multiplier: 2.75
    split_max_components: 12          # cap on pieces one blob can split into --
                                       # keeps individual trees/bushes, drops
                                       # leaf/twig-level over-splitting; tune
                                       # against debug_before.png/debug_after.png
    absorb_containment_threshold: 0.85 # a non-structural detection this contained
                                        # within a building/wall/rock/etc. detection
                                        # is dropped as a spurious sub-part (e.g. a
                                        # door pulled out of a building) rather than
                                        # kept as its own object

  - name: Object Correlation
    stage: ObjectCorrelationStage

  - name: Object Category Clustering
    stage: ObjectCategoryClusteringStage
    # Sub-clusters each class's detections by visual similarity (DINOv2
    # embeddings, agglomerative clustering) into 'bucket' groups -- e.g.
    # splitting one "flower" population into distinct color/species variants.
    # Tune against this stage's debug_panorama.png / clustering_debug.json.
    embedding_model_name: facebook/dinov2-base
    cluster_distance_threshold: 0.3   # cosine-distance cut; lower = more, finer buckets
    # The distance cut alone has no notion of how many buckets it produces. On a
    # full-panorama detection set it produced one bucket per instance -- measured on
    # an alpine-meadow capture: 302 (class, bucket) groups, 77 of them flower, 65
    # tree, 57 table. Each asks Panorama Asset Generation for its own mesh and its
    # own billboard pool, so pools collapse to a single crop (every instance of a
    # "variant" reusing one image) and Distribution Synthesis inherits 77 flower
    # variants. These bound the outcome rather than the cut: re-cut the same
    # dendrogram coarser if it overshoots, then fold undersized buckets into their
    # nearest surviving neighbour. Tune against clustering_debug.json's bucket_sizes.
    max_buckets_per_class: 8          # 0 disables (distance-cut only, prior behaviour)
    min_bucket_size: 3                # 0/1 disables the fold

  - name: Object Distribution
    stage: ObjectDistributionStage
    enabled: true           # learns the per-(class, region) spatial pattern that
                             # Distribution Synthesis below paints. Needs the pcf_cli
                             # binary from pattern-synthesis (cmake .. && make pcf_cli);
                             # without it the stage writes an empty result and paints
                             # nothing rather than failing.
    bin_count: 48
    # pcf_cli_path: /path/to/pattern-synthesis/build/pcf_cli  # override if needed

  - name: Distribution Synthesis
    stage: DistributionSynthesisStage
    enabled: true           # paints the learned pattern across every matching region
                             # so the environment is populated, not just the handful of
                             # instances the detector happened to catch. Previously off
                             # because the density it added wasn't supported by the real
                             # detections -- worth re-checking the debug images under
                             # temp/synthesis_{region}_{type}.png (red = real exemplars,
                             # yellow = painted) and backing off via
                             # input_boundary_pad_factor if it overshoots again.
                             #
                             # Requires BOTH Object Distribution above (for the pattern)
                             # and Panorama Asset Generation below (for the per-(class,
                             # bucket) meshes and billboard pools). Painted points carry
                             # no crop of their own, so with asset generation off every
                             # one of them is dropped at Scene Generation with a "no
                             # billboard crop available" warning.
    min_blob_area_cells: 64
    # THE cost knob, and the cheapest one to turn. Before a single iteration runs,
    # synthesize_pattern precomputes an O(candidates²) support table -- one Delaunay
    # walk per candidate pair -- so this sets a floor on tile cost that no point-count
    # or iteration change can get under. At 2000 that floor is ~4200² ≈ 17M walks per
    # tile, which is what put every near-field tile over the 120 s timeout.
    #
    # Lowering it does NOT coarsen placement: tile_side_m is tile_res × spacing and the
    # tile's candidate grid is tile_res² points over that area, so candidate SPACING is
    # invariant -- tiles just get smaller and more numerous (which also parallelises
    # better). Total work scales as tiles × candidates² ≈ linear in this value.
    # Measured on the Rainier capture:
    #     2000 -> 55 tiles,  6679 points requested, 220M relative precompute
    #      900 -> 92 tiles,  5574 points requested,  74M   (3x cheaper)
    #      400 -> 170 tiles, 4359 points requested,  27M   (8x cheaper)
    # The real trade-off is boundary effects: points near a tile edge see a truncated
    # neighbourhood, so more tiles means more of the population sitting on a seam. 900
    # is the compromise; drop to 400 if tiles still time out, raise toward 2000 if the
    # painted pattern starts showing tile-grid structure.
    max_candidates_per_tile: 900
    # Measured, not guessed: a tile's runtime is flat from 50 iterations to 400 (8.2s
    # vs 8.2s at n=166; 28.3s vs 28.4s at n=332), because the optimizer converges and
    # breaks out long before the cap -- 34 iterations on the tile that was profiled.
    # So this was never the cost lever, and raising it buys nothing.
    #
    # It is still worth bounding. A cap that is never reached costs nothing when the
    # tile converges, but turns a pathological non-converging tile from "hit
    # cli_timeout_s and paint NOTHING" into "paint a slightly under-converged pattern",
    # which is strictly the better failure. 100 leaves ~2x headroom over the observed
    # convergence point; below ~50 it starts truncating the largest tiles for real
    # (n=332 needs somewhere between 25 and 50, since 25 iters finishes in 16.5s).
    max_iters: 100
    size_jitter: 0.15
    input_boundary_pad_factor: 1.5
    # synthesize_cli is handed n_points=-1, so the painted count is INFERRED from the
    # input-vs-output candidate density ratio and scales with the painted area -- over
    # an output boundary covering most of the terrain grid. The binding constraint is
    # the client: SceneObjectManager instantiates one GameObject per placed object with
    # no GPU instancing, so this is a GameObject budget.
    #
    # Spend that budget where it reads rather than spreading it thin. A meadow has to
    # look like continuous ground cover in the near field, so the spacing floor stays
    # low (0.25 m ~ 16/m²) and the RADIUS controls do the limiting: full learned
    # density out to full_density_radius_m, thinning as (radius/distance)^exponent
    # beyond it, nothing at all past max_paint_radius_m -- at that range the terrain
    # texture and skybox panorama already carry the look and a billboard is sub-pixel.
    # Tiles wholly outside max_paint_radius_m are skipped before their synthesize_cli
    # call, which is most of them on a 100 m grid.
    #
    # If it still reads sparse: raise full_density_radius_m first, then
    # max_instances_per_group. If it's too heavy: lower full_density_radius_m, or
    # raise density_falloff_exponent to 1.5-2.0 to thin the mid-field harder. Check
    # temp/synthesis_{region}_{type}.png -- red = real exemplars, yellow = painted.
    min_exemplar_spacing_m: 0.25
    full_density_radius_m: 6.0
    density_falloff_exponent: 2.0
    max_paint_radius_m: 30.0         # 0 disables
    max_instances_per_group: 12000   # 0 disables the ceiling
    # Guard against a CLUMPED group (a few tight patches far apart) demanding a huge
    # exemplar candidate grid: the hull spans the empty gaps while spacing is measured
    # within the clumps, so e.g. three patches of 20 flowers 40 m apart asks for
    # ~25,600 candidates. The optimizer is O(candidates²) per iteration, so that tile
    # hits the 120 s subprocess timeout and the group silently paints NOTHING. Enforced
    # by raising the effective spacing (keeping both candidate grids at equal
    # points-per-area, which the count inference depends on), not by clamping.
    max_exemplar_candidates: 4000    # 0 disables
    cli_timeout_s: 120.0             # per-tile wall-clock budget for synthesize_cli.
                                      # Profiled on the Rainier capture at the settings above:
                                      # cost per tile is ~1s of fixed O(candidates²) precompute
                                      # plus a term growing as roughly n_points^2.3 -- 41 pts
                                      # =1.2s, 83=3.0s, 166=8.2s, 332=28.4s. The largest tile in
                                      # that scene asks for 332, so this leaves ~4x headroom.
                                      # That steep exponent is why the point count, not the
                                      # iteration budget, is the thing to watch: a 2x rise in
                                      # points is a ~5x rise in time.
                                      # Timeouts are logged with a count and a reason -- "N/M
                                      # tiles produced no points" is NOT the same as the data
                                      # being sparse. Lower max_candidates_per_tile first.
    # synthesize_cli_path: /path/to/pattern-synthesis/build/synthesize_cli  # override if needed
    # max_workers: 16  # concurrent synthesize_cli subprocesses (one per grid tile);
                        # default (unset) is os.cpu_count()

  - name: Grass Cover
    stage: GrassCoverStage
    enabled: true
    # Ground cover, derived from the ORIGINAL panorama's region typing rather than
    # the object-removed one the region map is built from -- foreground inpainting
    # replaces the near-field meadow with bare ground, so the region map has no
    # grass in it to scatter over. See pipeline/grass_cover/grass_area.py.
    #
    # Runs after Distribution Synthesis so the two never contend: this stage owns
    # the grass_tuft class outright, and its instances are written as `synthetic`
    # so Panorama Asset Generation below skips them the same way it skips painted
    # distribution points.
    max_radius_m: 25.0        # grass is one Object3D per instance with no client-side
                               # instancing, so coverage is bounded; the terrain texture
                               # carries the ground beyond this.
    instance_spacing_m: 0.4   # nominal lattice pitch before jitter
    max_instances: 8000       # budget; exceeding it widens the spacing uniformly
                               # rather than truncating the scatter
    bucket_count: 3           # distinct grass variants. Small on purpose -- the
                               # variety that reads comes from per-instance yaw and
                               # scale, not from many different tufts.
    build_near_meshes: true   # false = crossed cards at every distance (skips the
                               # per-bucket 3D generation; much faster to iterate on)
    max_near_mesh_faces: 4000 # face budget for the reconstructed tuft. SAM3D returns it
                               # undecimated -- measured at 316k/301k/208k faces and ~8 MB
                               # of GLB each, which is hero-object geometry for something
                               # placed thousands of times. Decimating to 4000 costs almost
                               # nothing visually (p95 surface error 0.19% of the bounding
                               # box diagonal) and takes the asset 8.22 MB -> 100 KB.
                               # Measured error at other budgets: 8000 -> 0.12%,
                               # 2000 -> 0.29%, 1000 -> 0.70%. 0 disables decimation.

  - name: Panorama Asset Generation
    stage: PanoramaAssetGenerationStage
    billboard_distance_m: 30.0
    # A (class, bucket) group only earns a bespoke 3D mesh when its winning crop's
    # detection box covers at least this fraction of the panorama -- meshing is
    # otherwise gated on distance alone, which lets a close-but-tiny subject through.
    # Measured on an alpine-meadow capture: foreground flowers 0.6-1 m from the
    # camera each occupy only ~0.01-0.07% of the frame (20-80 px) yet, split into a
    # bucket per colour, spawned 7 separate flower meshes (several singleton buckets,
    # one a conf-0.03 "sheep in grass" miscrop). Below this they stay billboard-only
    # (pool still curated -- not dropped). 0.001 (~0.1%, ~92x92 px) clears those while
    # keeping any genuine close foreground subject. 0 disables (distance-only).
    min_mesh_area_fraction: 0.001
    billboard_top_k: 4       # curated crops per (class, bucket) billboard pool
    generator_type: SAM3D

  - name: Scene Generation
    stage: SceneGenerationStage
    keys:
      panorama: panorama_sky
    eye_height_meters: 1.8   # target world-space depth of the terrain center below the viewer;
                              # sent to the client, which pushes the whole scene down to match
    mesh_lod_distance_m: 30.0 # bake-time mesh-vs-billboard cutoff -- deliberately mirrors
                               # Panorama Asset Generation's billboard_distance_m above (kept
                               # in sync manually; each stage parses its own isolated config)
    mesh_lod_distance_overrides:
      # Ground cover needs its own, far shorter cutoff. The global value is tuned for
      # subjects you look AT -- a tree at 25 m earns its mesh. Grass does not: Grass
      # Cover scatters 6,661 tufts, every one of them inside its own max_radius_m of
      # 25 m, so under the global 30 m cutoff all of them took the reconstructed near
      # mesh and the 12-triangle crossed-card LOD never rendered once.
      #
      # That reconstructed tuft is ~275,000 triangles (SAM3D output, undecimated).
      # Measured totals for the whole grass population at various cutoffs:
      #     25 m -> 6659 tufts + 2 cards    = 1831 M triangles   (what shipped)
      #     10 m -> 1536 tufts + 5125 cards =  422 M
      #      5 m ->  468 tufts + 6193 cards =  129 M
      #      3 m ->  174 tufts + 6487 cards =   48 M
      # 3 m keeps real 3D geometry underfoot, where a flat card would read as a
      # sticker, and hands everything past arm's reach to the cards.
      #
      # NOTE this only bounds the damage. 275k triangles for one grass tuft is the
      # real defect -- decimating that asset would buy far more than any cutoff here.
      grass_tuft: 3.0

  - name: Foreground Inpainting
    stage: ForegroundInpainting
    enabled: false

  - name: Panorama Cubemap
    stage: PanoramaToCubemapStage
    enabled: false

  - name: Video Generation
    stage: VideoGenerationStage
    enabled: true
    # Animate the full 360° panorama (ContextKey.PANORAMA -- the original, with real
    # objects still in it, not PANORAMA_TERRAIN/PANORAMA_SKY which have been through
    # foreground/sky inpainting) instead of just the narrow raw input photo.
    keys:
      input: panorama
    # camera_lora_strength: 0.0   # uncomment to disable the Camera-Control-Static LoRA

  - name: Video Object Extraction
    stage: VideoObjectExtractionStage
    # Tracks each Object Segmentation crop's mask across the video above (SAM2's video
    # predictor) and writes one object_video_{i} per detected object, isolated against
    # a black background. reference_frame_idx defaults to 0, matching Video Generation's
    # frame-0 conditioning on the same panorama Object Segmentation now ran against.
    keys:
      input: panorama

  - name: Object Motion Classification
    stage: ObjectMotionClassificationStage
    # Classifies each object_video_{i} as stationary (gentle in-place motion -- wind,
    # ripples) or moving (a rigid body translating through frame), from its own 2D
    # centroid trajectory. No-ops per object when Video Generation/Extraction above
    # produced nothing for it.

  - name: Category Mesh Rigging
    stage: CategoryMeshRiggingStage
    # Bakes a 3-bone sway skeleton into each shared category_mesh_{cls} (Panorama
    # Asset Generation) that has at least one stationary instance, for Scene
    # Animation's per-instance sway params to drive at runtime.
    #
    # This list is a performance budget as much as a taste judgement. Rigging makes an
    # asset a SkinnedMeshRenderer on the client -- skinned every frame, no GPU
    # instancing, no static batching, plus a WindSway.LateUpdate writing 3 bone
    # transforms per instance. Sensible for the ~60 trees and flowers it was designed
    # around; with grass_tuft included, Grass Cover's 6,661 instances make the entire
    # scene ~6,700 skinned meshes, which is what pins the frame rate to single digits
    # (and then reads as "nothing is animated", because the motion is too choppy to see).
    #
    # Comment grass_tuft out to render grass as plain static MeshRenderers. That is the
    # quickest way to confirm the frame rate is the problem, and a reasonable shipping
    # state until grass sway moves into a vertex shader, which is where ground-cover
    # wind belongs anyway -- no skinning, no per-instance CPU work.
    rig_categories: [tree, forest, bush, flower, plant, grass_tuft]

  - name: Scene Animation
    stage: SceneAnimationStage
    # Final pass: annotates Scene Generation's already-placed objects with animated-
    # billboard video, sway parameters, or rigid-body physics handoff, based on the
    # classification above. Purely additive -- placement itself is unchanged.
    sway_frequency_scale: 0.5   # global multiplier on every sway frequency (measured
                                 # and default alike). Raise toward 1.0 for a windier
                                 # scene; lower for stiller air.

  - name: Report
    stage: ReportGenerationStage
    enabled: false
