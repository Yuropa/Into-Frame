# Pipeline stage configuration.
#
# Each entry controls one stage in the pipeline:
#
#   name     – display name used in logs and progress output
#   stage    – class name from the stage registry (see pipeline.py STAGE_REGISTRY)
#   enabled  – set to false to skip a stage without removing it (default: true)
#   keys     – optional map of semantic keys to context keys, overriding defaults
#              (key names match SemanticKey enum values: input, output, depth, etc.)
#   <rest>   – stage-specific parameters forwarded to the stage's Configuration class
#
# Stages run in the order listed here.

stages:
  - name: Captioning
    stage: CaptioningStage

  - name: Depth Generation
    stage: DepthStage

  - name: Panorama
    stage: PanoramaStage
    generator_type: WORLDGEN

  - name: Panorama Supersampling
    stage: SupersamplingStage
    keys:
      input: panorama
      output: panorama

  - name: Panorama Object Depth
    stage: PanoramaDepthStage
    keys:
      output: panorama_object_depth

  - name: Panorama Inpainting
    stage: PanoramaInpaintingStage
    enabled: false
    full_panorama: true
    use_depth_filter: true
    depth_filter_threshold: 0.05       # Signal 1: slack above row-max baseline (0.0 = strict)
    depth_filter_edge_threshold: 0.005 # Signal 2: min edge depth-pop to keep a mask (lower = less strict)
    # Redirect the "objects removed, environment kept" output away from ContextKey.PANORAMA
    # (its normal default) — Panorama Regions / Skybox Inpainting / object detection all read
    # ContextKey.PANORAMA later and need the ORIGINAL (with-objects) panorama, exactly like
    # PanoramaForegroundInpaintingStage already leaves it untouched today. PANORAMA_TERRAIN
    # (what Panorama Depth → Height Map actually consumes) is written unconditionally either way.
    keys:
      output: panorama_foreground_removed

  - name: Panorama Foreground Inpainting
    stage: PanoramaForegroundInpaintingStage
    enabled: true
    use_depth_filter: true
    depth_filter_threshold: 0.05
    depth_filter_edge_threshold: 0.005
    mask_dilation_px: 15
    guidance_scale: 2.5
    num_inference_steps: 30

  - name: Panorama Regions
    stage: PanoramaRegionStage

  - name: Panorama Lighting
    stage: PanoramaLightingStage

  - name: Skybox Inpainting
    stage: SkyboxInpaintingStage
    # Widened from the previous 1/25 (4% of height) and 40px defaults — the boundary
    # between FLUX-generated sky and the real photo was reading as harsh/abrupt.
    shroud_radius_frac: 0.0667  # ~1/15 of panorama height: how far the fill mask buries
                                # the real horizon/ridge silhouette before FLUX paints, so
                                # it has no jagged contour to read. Larger = smoother
                                # sky-to-real transition, but covers more real photo content.
    seam_heal_width_px: 64      # width (px) of the final content-aware healing band blending
                                # any residual exposure/colour mismatch at the sky/terrain join.

  - name: Panorama Depth
    stage: PanoramaDepthStage
    keys:
      input: panorama_terrain

  - name: Panorama Depth Calibration
    stage: PanoramaDepthCalibrationStage
    # Fits a monotonic curve from DAP's raw 0-1 output to real metric depth using the region
    # where the original hero photo overlaps the panorama (Depth Anything 3's metric depth,
    # from the "Depth Generation" stage, is real ground truth there), then applies it to the
    # whole panorama. Replaces DAP's flat, unverified `pred * 100.0` assumption — see
    # server/pipeline/panorama_depth/pano_depth_imp.py — which otherwise makes distant terrain
    # (very common for mountain horizons) indistinguishable from its hard-clamped sky value.
    num_bins: 14
    min_samples: 300

  - name: Height Map
    stage: HeightMapStage
    # Panorama depth is equirectangular (radial distances); use spherical unprojection.
    keys:
      depth: panorama_depth
      intrinsics: intrinsics
    grid_size_meters: 200.0      # side length of the output grid in metres
    grid_resolution: 4096        # grid cells per side → ~4.9 cm/cell over 200 m
    ground_y_max: -0.5           # Y threshold (camera space): points ≤ this are ground candidates
    use_equirectangular: true    # depth is from equirectangular panorama, not pinhole
    smooth_sigma: 16.0           # distance-weighted smoothing: 0 at centre → this value (px) at corners
    camera_height_meters: 1.0   # assumed camera height above ground (metres); used to derive the Y
                                 # floor filter (ground_y_min = -(camera_height + 5.0)) that rejects
                                 # sky-pixel artefacts near the horizon, and as the flood-fill reference.
    flood_fill: true             # BFS from grid centre outward; stops at height jumps and sky gaps
    flood_fill_max_step: 1.5    # max Y change (metres) between adjacent cells in the flood-fill
    nadir_exclusion_radius: 1.5 # metres: discard near-nadir equirectangular pixels within this
                                 # radius of the camera; their depth is unreliable and projects
                                 # directly below the user, creating a spurious bowl/valley.
                                 # Kept small — this radius (plus nadir_ramp_width below) is
                                 # entirely unconstrained in the reconstruction solve, so making
                                 # it larger than necessary directly enlarges the flat disc around
                                 # the user.
    nadir_ramp_width: 3.0       # metres over which certainty ramps from 0 (at exclusion boundary)
                                 # to full geometric certainty; prevents a hard ring artifact.
    certainty_falloff_meters: 20.0 # distance at which observed-ground certainty decays to 0.5.
                                 # A depth-model-trust radius, NOT camera_height_meters — using
                                 # camera height (~1 m) here made certainty collapse to a few
                                 # percent within 2-3 m, below any usable confidence_threshold in
                                 # Terrain Reconstruction, so nothing beyond the nadir disc was ever
                                 # trusted and mid-range terrain was entirely reinvented by the
                                 # solver/noise. At 20 m, real ground crosses confidence_threshold
                                 # (0.18) out to ~43 m, matching the ~20 m ridge_min_anchor_distance
                                 # cutoff's assumption that near terrain is already observed.
    save_point_cloud: true      # debug artefact: dense sky-masked point cloud from the raw
                                 # panorama depth (no ground-plane Y filter, no grid binning),
                                 # written to <build>/ground_point_cloud.glb
    point_cloud_stride: 4       # take every Nth panorama pixel per axis before unprojecting
    min_forward_samples: 4      # minimum forward-projected panorama pixels landing in one grid
                                 # cell before its single inverse-mapped sample is overridden by
                                 # real per-cell mean/relief/slope statistics (near-field only —
                                 # far cells rarely collect enough samples and keep using the
                                 # existing inverse-mapped value)

  - name: Region Map
    stage: RegionMapStage
    grid_size_meters: 200.0     # must match Height Map grid extent
    grid_resolution: 4096       # must match Height Map resolution
    ground_y_max: -0.5
    camera_height_meters: 1.0
    nadir_exclusion_radius: 1.5 # metres: exclude near-nadir cells whose segmentation is
                                 # unreliable due to equirectangular distortion at the bottom
                                 # of the panorama; filled inward by the flood fill instead.
                                 # Must match Height Map's nadir_exclusion_radius.
    nadir_ramp_width: 3.0       # metres over which flood-fill certainty ramps up from 0.
    certainty_falloff_meters: 20.0 # must match Height Map's value — see that stage's comment.

  - name: Linear Structures
    stage: LinearStructureStage
    enabled: false
    modify_rivers: false
    modify_roads: false

  - name: Terrain Reconstruction
    stage: TerrainReconstructionStage
    solve_resolution: 512           # downsample to this for the harmonic solve, upsample after
    confidence_threshold: 0.18      # cells above this are held fixed at their observed elevation;
                                     # kept just above flat_zone_certainty (0.15) so the nadir flat
                                     # prior stays a soft, solver-overridable guess while real nearby
                                     # observations become anchors as soon as they're reasonably
                                     # certain, instead of leaving a large unconstrained disc that
                                     # the harmonic solve can only render maximally smooth.
                                     # Reachability depends on Height Map's certainty_falloff_meters
                                     # (currently 20 m): real ground crosses this threshold out to
                                     # ~43 m from camera. If that falloff value ever changes, sanity
                                     # check that 0.18 is still crossable — it previously wasn't
                                     # (certainty maxed at ~0.047 outside the nadir disc when the
                                     # falloff was tied to camera_height_meters ≈ 1 m).
    ridge_min_anchor_distance: 0.2  # fraction of grid half-radius; chains closer than this are skipped
                                     # (assumed already captured by observed terrain — lowered from
                                     # 0.5 so nearer ridges/hills still anchor the solve instead of
                                     # being left to pure interpolation).
    ridge_max_slope_angle_deg: 38.0 # angle of repose for slope envelope below ridge crests (°);
                                    # ~35° loose talus, ~38° consolidated rock, ~45° hard bedrock.
                                    # Only applies where cliff_mask is ~0; see cliff_max_slope_angle_deg.
    river_valley_depth: 0.5         # metres to lower river nodes below observed terrain
    river_drop_per_segment: 0.05    # additional metres drop per ordered river segment
    lake_y_range_threshold: 0.3     # Y-range threshold (m) to distinguish flat lakes from sloped water
    # Cliff mask: combines (a) measured slope on directly-observed, high-certainty
    # terrain — real ground truth, strongest close to the camera — with (b) distant
    # ridge-chain silhouette jaggedness, the only steepness signal available for
    # mountains beyond depth range. Written to context as CLIFF_MASK for reuse by
    # Terrain Noise Refinement.
    cliff_certainty_threshold: 0.35 # HEIGHT_MAP_CERTAINTY must be at least this to count a
                                     # cell's measured slope as real (not interpolated fill)
    cliff_slope_angle_low_deg: 50.0  # measured slope below this → not a cliff (strength 0)
    cliff_slope_angle_high_deg: 75.0 # measured slope at/above this → fully a cliff (strength 1)
    cliff_max_slope_angle_deg: 82.0  # slope envelope cap where cliff_mask > 0, vs. the talus
                                      # angle (ridge_max_slope_angle_deg) elsewhere
    # Cliff-top shelf: a directly-observed cliff face whose top edge borders occluded
    # terrain (camera saw the face, never the plateau beyond it) would otherwise be
    # left as free nodes with no local anchor, letting the harmonic solve ramp that
    # plateau down toward low ground fixed near the cliff's base. This projects a
    # shallow shelf outward from each cliff blob's crest instead.
    cliff_shelf_angle_deg: 8.0        # shallow assumed slope (°) projected outward from the
                                       # crest into occluded terrain beyond it. 0 disables.
    cliff_shelf_crest_percentile: 85.0 # within each connected measured-cliff blob, cells at/
                                        # above this elevation percentile count as the crest
    cliff_shelf_min_blob_cells: 20    # ignore measured-cliff blobs smaller than this (at solve
                                       # resolution) to avoid anchoring on stray steep-pixel noise

  - name: Terrain Noise Refinement
    stage: TerrainNoiseRefinementStage
    road_blend_weight: 0.8        # how strongly road skeleton flattens terrain (0–1)
    road_blur_sigma: 4.0          # pixel radius for softening road mask edges
    road_terrain_smooth_sigma: 6.0 # smoothing radius for the graded road proxy
    noise_scale: 80.0             # fBm base wavelength in pixels
    noise_octaves: 4              # fractal octave count
    noise_amplitude: 0.4          # metres of peak noise displacement
    linear_diffusivity: 1.0e-3    # Landlab K_d: hillslope diffusivity in m²/[synthetic yr]
    diffusion_dt: 2250.0          # synthetic timestep; diffusion_length ≈ sqrt(4 × K_d × dt) ≈ 3 m.
                                   # Raised from 200 (≈0.9 m) — that was only rounding multi-cell
                                   # solver artefacts, too short to smooth the kink where the ridge
                                   # slope envelope (see Terrain Reconstruction) snaps on against the
                                   # foreground. LinearDiffuser's implicit solve is unconditionally
                                   # stable, so raising dt alone (rather than K_d) is safe.
    landlab_resolution: 1024      # downsample to this resolution for Landlab, upsample after
    peak_sharpness: null          # null = auto-derive spatially from silhouette; explicit float = uniform
    peak_sharpness_min: 1.0       # auto range lower bound (flat/rolling hills)
    peak_sharpness_max: 2.5       # auto range upper bound (sharp alpine peaks)
    peak_sharpness_window_m: 20.0 # sliding window size (metres) for local jaggedness scoring
    peak_sharpness_spread_m: 15.0 # Gaussian spread radius (metres) from ridge into surrounding terrain
    hydro_enabled: true           # stream power erosion to carve valleys and channel networks
    hydro_erodibility: 1.0e-5    # K_sp: erodibility constant (m^(1-2m)/yr); increase to carve deeper
    hydro_dt: 1000.0              # timestep per erosion step (conceptual years)
    hydro_n_steps: 10             # number of erosion steps; total time = hydro_dt × hydro_n_steps
    hydro_resolution: 256         # downsample resolution for flow routing (speed vs. channel detail)
    cliff_noise_suppression: 0.85 # fraction of fBm noise amplitude suppressed on CLIFF_MASK cells;
                                   # diffusion and hydro erosion are always fully excluded there
                                   # (see TerrainReconstructionStage for how the mask is built)

  - name: Region Map Refinement
    stage: RegionMapRefinementStage
    certainty_threshold: 0.2        # cells below this are candidates for height-based reclassification
    water_elevation_tolerance: 0.5  # metres; cells within this band of known water surface → WATER
    water_gradient_threshold: 0.04  # m/m slope; flatter than this is eligible for WATER
    terrain_gradient_threshold: 0.15 # m/m slope; steeper than this → TERRAIN
    paint_width: 2                  # grid-cell half-width to dilate painted polylines

  - name: Terrain Mesh
    stage: TerrainMeshStage
    inner_min_dist: 0.10    # metres between samples at the origin (10 cm)
    outer_min_dist: 2.0     # metres between samples at the domain corners
    n_boundary: 64          # anchor points per edge of the domain rectangle
    z_far: null
    noise_amplitude: 0.05   # metres of peak noise displacement
    noise_blend_floor: 0.15 # minimum noise blend fraction at the camera origin (was 0, which left
                             # the ground directly under the user perfectly noise-free); ramps up
                             # to 1.0 at the domain corner as before

  - name: Terrain Texture Generation
    stage: TerrainTextureGenerationStage
    tile_size: 1024             # px per seamless region tile (FLUX generates at this size)
    blend_map_size: 512         # px for the blend maps
    blend_sigma: 0.05           # gaussian blend width at region boundaries (fraction of blend_map_size)
    min_region_fraction: 0.02   # regions smaller than this fraction are skipped
    inpainting_type: FLUX
    num_inference_steps: 35
    guidance_scale: 3.5
    seam_width_fraction: 0.08   # half-width of seam mask as fraction of tile_size
    seam_dilation_px: 4         # dilation applied to seam mask before inpainting
    # Margin (fraction of tile_size) around all four tile edges that Pass 1 fills with
    # real (upscaled, if soft) reference content and marks "keep" instead of "generate".
    # Reference patches are always kept away from the edges (see seam_width_fraction /
    # seam_dilation_px above), which otherwise left the outer border as one huge unbounded
    # generate region right at the tile edge -- the least-conditioned spot for a hole-fill
    # model, and the source of a visibly soft/artificial ring there. 0 disables it.
    border_fill_fraction: 0.08
    # Several real reference crops (_extract_reference_patches), spaced apart on the tile
    # canvas (_patch_placements), instead of one -- gives Pass 1 more than one real colour/
    # lighting anchor to match against, since generated fill can drift far from a single one.
    num_reference_patches: 1
    # Each patch's size as a fraction of tile_size when there's only one; scaled down by
    # 1/sqrt(num_reference_patches) so total covered area stays comparable. 0.7 still leaves
    # a comfortable margin before the seam-fix band (~4-9% of tile_size from each edge) so
    # the two never overlap.
    reference_patch_fraction: 0.7
    # Delight each reference patch with IntrinsicDiffusion (predicted albedo) before it's
    # used as a Pass 1 guidance seed, instead of the raw photo pixels -- the raw patch's
    # baked-in sun/shadow/exposure gets stamped across the whole tile at
    # synthetic_tile_factor repeats, which doesn't tile and fights the tile's own "flat
    # overcast, no directional shadows" prompt.
    use_intrinsic_delighting: true
    intrinsic_resolution: 768   # working resolution for the delighting pass
    intrinsic_agg_num: 2        # samples averaged per delit patch (lower = faster, guidance seed only)
    # Swin2SR 2x each (optionally delit) reference patch, then LANCZOS back down to its own
    # size, before it's composited onto the Pass 1 canvas -- sharper/denoised source for
    # both the pasted patch itself and the canvas's own background fill (which stretches a
    # copy of it up to the full tile), the same "render bigger, downsample for quality"
    # trick used for Flux fills elsewhere (see supersample_inpaint).
    use_patch_supersampling: true
    # Pass 1 extends the patch to fill the whole tile as pure guidance (not hard-preserved):
    # LAMA = classical texture-completion, no prompt/LoRA/hallucination (recommended — the
    # LoRA doesn't reliably honour a "keep" mask region since it was never trained on masked
    # inputs, observed as the patch being replaced with unrelated content). FLUX = ordinary
    # img2img with this stage's own LoRA temporarily disabled instead.
    pass1_inpainting_type: LAMA
    # Temporarily off -- FLUX_SEAMLESS_TEXTURE was producing visible artifacts. Runs plain
    # FLUX.1-Fill-dev with no LoRA loaded at all until re-enabled.
    use_lora: false
    mask_feather_px: 12.0       # Pass-1 mask feather (FLUX option only; LaMa ignores it)
    reference_strength: 0.60   # img2img strength for Pass 1 (if FLUX) and Pass 2's full-tile
                               # LoRA repaint over Pass 1 — the only thing anchoring Pass 2
                               # to Pass 1's real-texture content rather than inventing anew
    # 200 m terrain / 4 m per tile = 50 repeats → ~0.4 cm/texel at 1024 px
    # Adjust proportionally for different grid_size_meters: factor = grid_size / tile_world_size
    synthetic_tile_factor: 50.0
    # Panorama layer coverage: viewing-latitude ramp (camera at world origin) that keeps
    # the real photo dominant across almost the whole terrain. Synthetic tiles only fill
    # the narrow nadir hole under the camera and a thin band right at the horizon, where
    # distant flat ground is compressed into just a few panorama pixel rows.
    use_panorama_layer: true
    panorama_blend_power: 1.0   # exponent on the latitude ramp; higher sharpens the fades
    nadir_cutoff_deg: -85.0     # steeper than this (near-straight-down) → synthetic only
    nadir_fade_deg: 4.0         # ramp width above the nadir cutoff
    horizon_fade_deg: 1.5       # ramp width below the horizon
    # Debug: save every intermediate image of the generation process (reference patch,
    # Pass 1 canvas/mask/result, Pass 2 raw/seam-fixed/sharpened/final) per region to
    # <temp>/texture_generation/, so each step can be inspected.
    debug_save_steps: true

  # Object processing: segmentation → classification → typing → recognition → detection → correlation
  # All six stages must be enabled together; PanoramaAssetGeneration consumes their output.

  - name: Object Segmentation
    stage: SegmentationStage

  - name: Object Classification
    stage: PanoramaObjectClassificationStage

  - name: Object Typing
    stage: ObjectTypingStage

  - name: Object Recognition
    stage: RecognizeAnythingStage

  - name: Object Detection
    stage: ObjectDetectionStage

  - name: Object Correlation
    stage: ObjectCorrelationStage

  - name: Object Distribution
    stage: ObjectDistributionStage
    bin_count: 48
    # pcf_cli_path: /path/to/pattern-synthesis/build/pcf_cli  # override if needed

  - name: Distribution Synthesis
    stage: DistributionSynthesisStage
    min_blob_area_cells: 64
    max_candidates_per_tile: 2000
    max_iters: 400
    size_jitter: 0.15
    input_boundary_pad_factor: 1.5
    # synthesize_cli_path: /path/to/pattern-synthesis/build/synthesize_cli  # override if needed

  - name: Panorama Asset Generation
    stage: PanoramaAssetGenerationStage
    billboard_distance_m: 30.0
    generator_type: SAM3D
    exclude_categories:
      - tree
      - forest
      - bush
      - flower
      - plant

  - name: Tree Mesh Generation
    stage: TreeMeshGenerationStage
    enabled: false

  - name: Scene Generation
    stage: SceneGenerationStage
    keys:
      panorama: panorama_sky
    eye_height_meters: 1.8   # target world-space depth of the terrain center below the viewer;
                              # sent to the client, which pushes the whole scene down to match

  - name: Foreground Inpainting
    stage: ForegroundInpainting
    enabled: false

  - name: Panorama Cubemap
    stage: PanoramaToCubemapStage
    enabled: false

  - name: Report
    stage: ReportGenerationStage
    enabled: false
